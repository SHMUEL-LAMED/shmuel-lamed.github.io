<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ydcfafijktzasrkkxyux.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f5f4ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<title>Claude</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d97757'/%3E%3Cpath d='M50 18v64M18 50h64M27 27l46 46M73 27 27 73' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf9f5;--side:#f5f4ed;--panel:#fff;--ink:#1f1e1d;--mute:#73726c;--line:#e6e3da;--hover:#ece9e0;--sel:#e8e5da;
  --acc:#d97757;--acc2:#c96442;--user:#f0eee6;--code:#f2f0e9;--bad:#b3261e;--ok:#2e8b57;
  --shadow:0 1px 3px rgba(31,30,29,.06),0 6px 20px rgba(31,30,29,.06);--pop:0 10px 34px rgba(31,30,29,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#262624;--side:#1f1e1d;--panel:#30302e;--ink:#f0eee6;--mute:#a6a39a;--line:#3a3936;--hover:#2f2e2b;--sel:#3a3936;
  --acc:#d97757;--acc2:#e08a6c;--user:#141413;--code:#1a1a18;--bad:#ff8a80;--ok:#6fcf97;
  --shadow:0 1px 3px rgba(0,0,0,.35);--pop:0 10px 34px rgba(0,0,0,.55);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--mute);text-decoration:none;transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--ink)}
.mark{width:28px;height:28px;flex:none;color:var(--acc)}
.mark svg{width:100%;height:100%;stroke-width:2.6}

/* סרגל השיחות */
#side{width:288px;flex:none;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;height:100%;transition:margin .2s,transform .2s}
body.closed #side{margin-inline-start:-288px}
#sidetop{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
#sidetop .name{flex:1;font-weight:700;font-size:19px;letter-spacing:.2px;font-family:Georgia,"Times New Roman",serif}
#newbtn{display:flex;align-items:center;gap:10px;margin:6px 10px;padding:9px 12px;border-radius:12px;font-weight:600;color:var(--acc2)}
#newbtn:hover{background:var(--hover)}
#newbtn .plus{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center}
#newbtn .plus svg{width:16px;height:16px;stroke-width:2.6}
#search{margin:4px 10px 8px;position:relative}
#search input{width:100%;padding:8px 34px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:0;font-size:14px}
#search input:focus{border-color:var(--acc)}
#search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
#convs{flex:1;overflow-y:auto;padding:0 8px 10px}
.grp{font-size:12px;color:var(--mute);font-weight:600;padding:12px 10px 4px}
.ci{display:flex;align-items:center;border-radius:10px;position:relative}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--sel)}
.ci > button.t{flex:1;min-width:0;text-align:start;padding:7px 10px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .pin{color:var(--acc);margin-inline-start:4px}
.ci .more{opacity:0;width:30px;height:30px}
.ci:hover .more,.ci.on .more,.ci .more:focus-visible{opacity:1}
.ci .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-inline-end:8px;flex:none}
#sidefoot{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px}
#sidefoot a{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;padding:8px 10px;border-radius:10px;flex:1;font-size:14.5px}
#sidefoot a:hover{background:var(--hover)}
#scrim{display:none}

/* אזור השיחה */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#head{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:54px}
#htitle{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 8px;border-radius:8px}
#htitle.can:hover{background:var(--hover);cursor:pointer}
#status{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
#status.on{color:var(--ok)}
#status.on::before{background:var(--ok)}
#scroll{flex:1;overflow-y:auto}
#msgs{max-width:780px;margin:0 auto;padding:10px 18px 30px;display:flex;flex-direction:column;gap:22px}
.u{align-self:flex-start;max-width:85%;background:var(--user);padding:10px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.u.pend{opacity:.7}
.u .att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;max-width:240px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--acc)}
.chip button{color:var(--mute);margin-inline-start:2px}
.meta{font-size:12px;color:var(--mute);margin-top:4px}
.u + .meta{align-self:flex-start;margin-top:-16px;padding-inline-start:6px}
.a{display:flex;gap:12px;align-items:flex-start}
.a .mark{margin-top:2px}
.a .body{flex:1;min-width:0;overflow-wrap:anywhere}
.a .body > :first-child{margin-top:0}
.a .body > :last-child{margin-bottom:0}
.a .body p{margin:0 0 .7em}
.a .body h1,.a .body h2,.a .body h3{font-size:1.08em;margin:1em 0 .4em}
.a .body ul,.a .body ol{margin:.3em 0 .8em;padding-inline-start:1.5em}
.a .body li{margin:.2em 0}
.a .body code{background:var(--code);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-family:ui-monospace,Consolas,monospace;font-size:.9em;direction:ltr;unicode-bidi:isolate}
.a .body pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;direction:ltr;text-align:left}
.a .body pre code{border:0;padding:0;background:none}
.a .body hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.a .body blockquote{margin:.5em 0;padding-inline-start:12px;border-inline-start:3px solid var(--line);color:var(--mute)}
.acts{display:flex;gap:2px;margin-top:6px;align-items:center}
.acts .ib{width:30px;height:30px;border-radius:8px}
.acts .ib svg{width:16px;height:16px}
.acts .meta{margin:0 6px}
.cf{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.cf b{display:block;margin-bottom:6px}
.cf .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2)}
.wait{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14.5px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.day{align-self:center;font-size:12px;color:var(--mute)}

/* מסך פתיחה */
#hello{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#hello h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,5vw,38px);margin:10px 0 24px;display:flex;align-items:center;gap:12px}
#hello h1 .mark{width:36px;height:36px}
#sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px;margin-top:14px}
#sugg button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:8px}
#sugg button:hover{color:var(--ink);background:var(--hover)}
#sugg svg{width:16px;height:16px;color:var(--acc)}

/* תיבת הכתיבה */
#composeWrap{padding:0 16px max(14px,env(safe-area-inset-bottom))}
#hello #composeWrap{width:100%;max-width:700px;padding:0}
#compose{max-width:780px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:10px 12px 8px;transition:border-color .15s}
#compose:focus-within{border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
#compose.drag{border-color:var(--acc);border-style:dashed}
#atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#atts:empty{display:none}
#text{width:100%;resize:none;border:0;outline:0;background:none;max-height:240px;min-height:28px;padding:4px 6px;line-height:1.5}
#ctools{display:flex;align-items:center;gap:4px;margin-top:4px}
#ctools .sp{flex:1}
#hint{font-size:12px;color:var(--mute)}
#sendbtn{width:34px;height:34px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center}
#sendbtn:hover{background:var(--acc2)}
#sendbtn:disabled{opacity:.4;cursor:default}
#sendbtn svg{stroke-width:2.4}
#foot{text-align:center;font-size:12px;color:var(--mute);margin-top:6px}

/* תפריט ותיבות */
#menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:5px;min-width:170px}
#menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:8px 10px;border-radius:8px;font-size:14.5px}
#menu button:hover{background:var(--hover)}
#menu button.bad{color:var(--bad)}
#menu svg{width:17px;height:17px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;z-index:40;box-shadow:var(--pop)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:20px;width:min(420px,92vw);box-shadow:var(--pop)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px;font-size:18px}
dialog input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:0}
dialog input:focus{border-color:var(--acc)}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media (max-width:820px){
  #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:20;box-shadow:var(--pop)}
  body.closed #side{margin:0;transform:translateX(100%)}
  body:not(.closed) #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  #msgs{padding:8px 14px 24px}
  .u{max-width:92%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="closed">
<aside id="side" aria-label="שיחות">
  <div id="sidetop">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg></span>
    <span class="name">Claude</span>
    <button class="ib" id="closeSide" title="סגירת הסרגל" aria-label="סגירת הסרגל"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
  </div>
  <button id="newbtn"><span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>שיחה חדשה</button>
  <div id="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="חיפוש בשיחות" aria-label="חיפוש בשיחות"></div>
  <nav id="convs"></nav>
  <div id="sidefoot">
    <a href="./"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>חזרה לצ'אטים</a>
  </div>
</aside>
<div id="scrim"></div>
<main id="main">
  <header id="head">
    <button class="ib" id="openSide" title="השיחות" aria-label="פתיחת רשימת השיחות"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
    <button class="ib" id="newTop" title="שיחה חדשה" aria-label="שיחה חדשה"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <div id="htitle"></div>
    <div id="status" role="status"></div>
  </header>
  <div id="hello">
    <h1><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg></span><span id="greet">במה אפשר לעזור?</span></h1>
    <div id="composeSlot"></div>
    <div id="sugg"></div>
  </div>
  <div id="scroll" class="hide"><div id="msgs"></div></div>
  <div id="composeWrap">
    <form id="compose">
      <div id="atts"></div>
      <textarea id="text" rows="1" placeholder="כתוב הודעה ל-Claude..." aria-label="הודעה ל-Claude"></textarea>
      <div id="ctools">
        <button type="button" class="ib" id="attbtn" title="צירוף קובץ טקסט" aria-label="צירוף קובץ"><svg viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button>
        <input type="file" id="file" class="hide" multiple accept=".txt,.md,.csv,.tsv,.json,.js,.mjs,.ts,.jsx,.tsx,.html,.htm,.css,.py,.xml,.yml,.yaml,.ini,.log,.sql,.sh,.java,.c,.cpp,.h,.cs,.php,.rb,.go,.rs,.srt,text/*">
        <span class="sp"></span>
        <span id="hint"></span>
        <button type="submit" id="sendbtn" title="שליחה" aria-label="שליחה" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </form>
    <div id="foot">Claude עונה כשהוא מחובר. אם לא – ההודעה ממתינה והתשובה תופיע כאן.</div>
  </div>
</main>
<div id="menu" class="hide" role="menu"></div>
<div id="toast" class="hide" role="status"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dlgT"></h3><input id="dlgI" maxlength="80"><div class="row"><button class="btn" value="no">ביטול</button><button class="btn pri" value="ok" id="dlgOk">שמירה</button></div></form></dialog>
<script>
"use strict";
// השיחה עם Claude, בסגנון האתר של Claude: כמה שיחות נפרדות, רשימה בצד, צירוף קובצי טקסט.
// עובר דרך הגשר ב-Supabase (נטפרי חוסם workers.dev), עם אותה כניסה של אתר הצאט.
const API = "https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/chat-netfree/";
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let token = "";
try { token = localStorage.getItem("chat_token") || ""; } catch (e) {}
if (!token) location.replace("./");

const OLD = "old"; // הודעות מלפני שהיו שיחות נפרדות
let items = [], live = false, sig = "", sending = false, loaded = false;
let meta = store.get("claude_convs", {}); // { id: { title, hidden, pinned, made } }
let cur = store.get("claude_cur", "");
let atts = []; // { name, text }
const MAX_ATT = 12000;

function el(tag, cls, text) { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
function icon(d) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = d; return s; }
const IC = {
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  ok: '<path d="m5 12 5 5 9-10"/>',
  dots: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  edit: '<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  pin: '<path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  retry: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  quote: '<path d="M7 7h4v6H5v-2a4 4 0 0 1 2-4zM15 7h4v6h-6v-2a4 4 0 0 1 2-4z"/>',
  idea: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/>',
  code: '<path d="m8 6-6 6 6 6M16 6l6 6-6 6"/>',
};

async function api(op, body) {
  let r;
  try {
    r = await fetch(API + op + "?token=" + encodeURIComponent(token), {
      method: body ? "POST" : "GET",
      headers: body ? { "content-type": "text/plain;charset=UTF-8" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw new Error("אין חיבור לשרת"); }
  const j = await r.json().catch(() => ({ error: "תקלה בחיבור" }));
  if (r.status === 401) { try { localStorage.removeItem("chat_token"); } catch (e) {} location.replace("./"); }
  if (!r.ok || j.error) throw new Error(j.error || "תקלה");
  return j;
}
function toast(t) { const x = $("toast"); x.textContent = t; x.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.add("hide"), 2200); }
const saveMeta = () => store.set("claude_convs", meta);
const newId = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtTime = (t) => new Date(t).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
function fmtDay(t) {
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return "היום";
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return "אתמול";
  return d.toLocaleDateString("he-IL", { day: "numeric", month: "long" });
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "לילה טוב" : h < 12 ? "בוקר טוב" : h < 17 ? "צהריים טובים" : h < 21 ? "ערב טוב" : "לילה טוב";
}

// ---- רשימת השיחות: מהשרת (לפי conv) ומהשיחות החדשות שנפתחו כאן
function convList() {
  const map = new Map();
  for (const m of items) {
    const id = m.conv || OLD;
    if (!map.has(id)) map.set(id, { id, first: "", last: 0, count: 0, waiting: false });
    const c = map.get(id);
    if (m.from === "me" && !c.first) c.first = m.text;
    c.last = Math.max(c.last, m.at); c.count++;
    c.waiting = m.from === "me";
  }
  for (const [id, x] of Object.entries(meta)) if (!map.has(id) && x.made && id === cur) map.set(id, { id, first: "", last: x.made, count: 0, waiting: false });
  return [...map.values()].filter((c) => !meta[c.id]?.hidden).map((c) => ({
    ...c,
    title: meta[c.id]?.title || (c.id === OLD ? "השיחה הקודמת" : (c.first ? (splitAtt(c.first).text || splitAtt(c.first).files.join(", ") || "שיחה").replace(/\s+/g, " ").slice(0, 48) : "שיחה חדשה")),
    pinned: !!meta[c.id]?.pinned,
  })).sort((a, b) => (b.pinned - a.pinned) || (b.last - a.last));
}
function renderSide() {
  const box = $("convs"), q = $("q").value.trim().toLowerCase();
  box.textContent = "";
  let list = convList();
  if (q) list = list.filter((c) => c.title.toLowerCase().includes(q) || items.some((m) => (m.conv || OLD) === c.id && String(m.text).toLowerCase().includes(q)));
  if (!list.length) { box.appendChild(el("div", "grp", q ? "לא נמצאו שיחות" : "אין עדיין שיחות")); return; }
  let g = "";
  for (const c of list) {
    const ng = c.pinned ? "מוצמדות" : groupOf(c.last);
    if (ng !== g) { box.appendChild(el("div", "grp", ng)); g = ng; }
    const row = el("div", "ci" + (c.id === cur ? " on" : ""));
    const t = el("button", "t", c.title); t.title = c.title;
    t.onclick = () => { open(c.id); if (innerWidth <= 820) document.body.classList.add("closed"); };
    if (c.pinned) t.prepend(el("span", "pin", "• "));
    const more = el("button", "ib more"); more.appendChild(icon(IC.dots)); more.setAttribute("aria-label", "אפשרויות לשיחה");
    more.onclick = (e) => { e.stopPropagation(); convMenu(c, more); };
    row.append(t);
    if (c.waiting && c.id !== cur) row.append(el("span", "dot"));
    row.append(more);
    box.appendChild(row);
  }
}
function groupOf(t) {
  const d = (Date.now() - t) / 864e5, day = fmtDay(t);
  if (day === "היום" || day === "אתמול") return day;
  return d < 7 ? "השבוע" : d < 31 ? "החודש" : "קודם";
}
function convMenu(c, anchor) {
  showMenu(anchor, [
    [c.pinned ? "ביטול הצמדה" : "הצמדה למעלה", IC.pin, () => { meta[c.id] = { ...meta[c.id], pinned: !c.pinned }; saveMeta(); renderSide(); }],
    ["שינוי שם", IC.edit, () => rename(c.id, c.title)],
    ["הסתרת השיחה", IC.trash, () => {
      meta[c.id] = { ...meta[c.id], hidden: true }; saveMeta();
      if (cur === c.id) startNew(); else renderSide();
      toast("השיחה הוסתרה מהרשימה");
    }, "bad"],
  ]);
}
function showMenu(anchor, rows) {
  const m = $("menu"); m.textContent = "";
  for (const [label, ic, fn, cls] of rows) {
    const b = el("button", cls || ""); b.setAttribute("role", "menuitem");
    b.append(icon(ic), document.createTextNode(label));
    b.onclick = () => { hideMenu(); fn(); };
    m.appendChild(b);
  }
  m.classList.remove("hide");
  const r = anchor.getBoundingClientRect();
  m.style.top = Math.min(innerHeight - m.offsetHeight - 8, r.bottom + 4) + "px";
  m.style.left = Math.max(8, Math.min(innerWidth - m.offsetWidth - 8, r.left)) + "px";
  m.querySelector("button")?.focus();
}
function hideMenu() { $("menu").classList.add("hide"); }
document.addEventListener("click", (e) => { if (!$("menu").contains(e.target)) hideMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu(); });

function rename(id, title) {
  const d = $("dlg"); $("dlgT").textContent = "שינוי שם לשיחה"; $("dlgI").value = title;
  d.onclose = () => {
    if (d.returnValue !== "ok") return;
    const v = $("dlgI").value.trim();
    meta[id] = { ...meta[id], title: v || undefined }; saveMeta(); renderSide(); renderHead();
  };
  d.showModal(); $("dlgI").select();
}

// ---- תצוגת שיחה
function startNew() {
  cur = newId(); meta[cur] = { made: Date.now() }; saveMeta(); store.set("claude_cur", cur);
  sig = ""; loadDraft(); render(); $("text").focus();
}
function open(id) { cur = id; store.set("claude_cur", cur); sig = ""; loadDraft(); render(); }
function loadDraft() { $("text").value = store.get("claude_draft_" + cur, "") || ""; atts = []; renderAtts(); grow(); updSend(); }
function renderHead() {
  const c = convList().find((x) => x.id === cur);
  const has = items.some((m) => (m.conv || OLD) === cur);
  $("htitle").textContent = has && c ? c.title : "";
  $("htitle").className = has ? "can" : "";
  const s = $("status");
  s.className = live ? "on" : ""; s.textContent = live ? "Claude מחובר" : "Claude לא מחובר כרגע";
}
$("htitle").onclick = () => { if ($("htitle").className === "can") rename(cur, $("htitle").textContent); };

const SUGG = [
  [IC.pen, "עזרה בניסוח", "תעזור לי לנסח "],
  [IC.code, "שינוי באתר", "אני רוצה לשנות באתר "],
  [IC.book, "סידור דברי תורה", "תעזור לי לסדר ולנסח את מה שכתבתי: "],
  [IC.idea, "רעיונות", "תן לי רעיונות ל"],
];
function renderHello() {
  $("greet").textContent = greeting() + ", שמואל";
  const s = $("sugg"); s.textContent = "";
  for (const [ic, label, text] of SUGG) {
    const b = el("button"); b.type = "button"; b.append(icon(ic), document.createTextNode(label));
    b.onclick = () => { const t = $("text"); t.value = text; t.focus(); grow(); updSend(); };
    s.appendChild(b);
  }
}
function render() {
  const mine = items.filter((m) => (m.conv || OLD) === cur);
  const empty = !mine.length;
  $("hello").classList.toggle("hide", !empty);
  $("scroll").classList.toggle("hide", empty);
  // תיבת הכתיבה באמצע במסך הפתיחה, ולמטה בתוך שיחה
  const wrap = $("composeWrap");
  if (empty && wrap.parentNode !== $("composeSlot")) $("composeSlot").appendChild(wrap);
  if (!empty && wrap.parentNode !== $("main")) $("main").appendChild(wrap);
  $("foot").classList.toggle("hide", empty);
  renderHead(); renderSide();
  if (empty) { renderHello(); return; }
  const s = JSON.stringify(mine.map((m) => [m.id, m.status, m.text.length])) + live + fmtDay(Date.now());
  if (s === sig) return;
  sig = s;
  const sc = $("scroll"), atEnd = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120;
  const box = $("msgs"); box.textContent = "";
  let lastDay = "";
  for (const m of mine) {
    const day = fmtDay(m.at);
    if (day !== lastDay) { box.appendChild(el("div", "day", day)); lastDay = day; }
    if (m.from === "me") {
      const u = el("div", "u" + (m.status === "new" ? " pend" : ""));
      const { text, files } = splitAtt(m.text);
      if (files.length) { const a = el("div", "att"); files.forEach((f) => a.appendChild(fileChip(f))); u.appendChild(a); }
      u.appendChild(document.createTextNode(text));
      box.appendChild(u);
      box.appendChild(el("div", "meta", fmtTime(m.at) + (m.status === "new" ? " · ממתין ל-Claude" : "")));
    } else {
      const a = el("div", "a");
      const mk = el("span", "mark"); mk.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>';
      const body = el("div", "body"); body.appendChild(md(m.text));
      const wrapB = el("div"); wrapB.style.flex = "1"; wrapB.style.minWidth = "0"; wrapB.appendChild(body);
      if (m.confirm) {
        const cf = el("div", "cf"); cf.appendChild(el("b", "", "ממתין לאישור שלך"));
        cf.appendChild(document.createTextNode(m.confirm));
        const row = el("div", "row");
        const yes = el("button", "btn pri", "מאשר"), no = el("button", "btn", "לבטל"), chg = el("button", "btn", "בקשת שינוי");
        yes.onclick = () => send("(מאושר)"); no.onclick = () => send("(לא מאושר, לבטל)");
        chg.onclick = () => { $("text").value = "(בקשת שינוי) "; $("text").focus(); updSend(); };
        row.append(yes, no, chg); cf.appendChild(row); wrapB.appendChild(cf);
      }
      const acts = el("div", "acts");
      const cp = el("button", "ib"); cp.title = "העתקה"; cp.setAttribute("aria-label", "העתקת התשובה"); cp.appendChild(icon(IC.copy));
      cp.onclick = () => copy(m.text, cp);
      const qt = el("button", "ib"); qt.title = "ציטוט בתשובה"; qt.setAttribute("aria-label", "ציטוט"); qt.appendChild(icon(IC.quote));
      qt.onclick = () => { const t = $("text"); t.value = "> " + m.text.split("\n").slice(0, 3).join("\n> ") + "\n\n" + t.value; t.focus(); grow(); updSend(); };
      acts.append(cp, qt, el("span", "meta", fmtTime(m.at)));
      wrapB.appendChild(acts);
      a.append(mk, wrapB);
      box.appendChild(a);
    }
  }
  const lastMine = mine[mine.length - 1];
  if (lastMine.from === "me") {
    const w = el("div", "wait");
    if (live) { const d = el("span", "dots"); d.innerHTML = "<i></i><i></i><i></i>"; w.append(d, document.createTextNode("Claude כותב תשובה...")); }
    else w.textContent = "Claude לא מחובר כרגע. ההודעה שמורה, והתשובה תופיע כאן כשהוא יתחבר.";
    box.appendChild(w);
  }
  if (atEnd || !loaded) sc.scrollTop = sc.scrollHeight;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const t = el("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (x) {} t.remove();
  }
  if (btn) { btn.textContent = ""; btn.appendChild(icon(IC.ok)); setTimeout(() => { btn.textContent = ""; btn.appendChild(icon(IC.copy)); }, 1500); }
  toast("הועתק");
}

// Markdown קל לתשובות: כותרות, רשימות, הדגשה, קוד, ציטוט, קו מפריד. בונה DOM בלי innerHTML מהתוכן
function md(src) {
  const frag = document.createDocumentFragment();
  const lines = String(src).replace(/\r/g, "").split("\n");
  let i = 0, list = null, para = null;
  const flush = () => { list = null; para = null; };
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; flush();
      const pre = el("pre"), code = el("code", "", buf.join("\n")); pre.appendChild(code); frag.appendChild(pre); continue;
    }
    let mm;
    if (!l.trim()) { flush(); i++; continue; }
    if ((mm = l.match(/^(#{1,3})\s+(.*)$/))) { flush(); const h = el("h" + mm[1].length); inline(h, mm[2]); frag.appendChild(h); i++; continue; }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flush(); frag.appendChild(el("hr")); i++; continue; }
    if ((mm = l.match(/^>\s?(.*)$/))) { flush(); const q = el("blockquote"); inline(q, mm[1]); frag.appendChild(q); i++; continue; }
    if ((mm = l.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/))) {
      const ord = /\d/.test(mm[1]);
      if (!list || list.tagName !== (ord ? "OL" : "UL")) { para = null; list = el(ord ? "ol" : "ul"); frag.appendChild(list); }
      const li = el("li"); inline(li, mm[2]); list.appendChild(li); i++; continue;
    }
    list = null;
    if (!para) { para = el("p"); frag.appendChild(para); } else para.appendChild(el("br"));
    inline(para, l); i++;
  }
  return frag;
}
function inline(node, s) {
  const re = /(\*\*([^*]+)\*\*|`([^`]+)`|\*([^*\s][^*]*)\*)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) node.appendChild(document.createTextNode(s.slice(last, m.index)));
    if (m[2] != null) node.appendChild(el("strong", "", m[2]));
    else if (m[3] != null) node.appendChild(el("code", "", m[3]));
    else node.appendChild(el("em", "", m[4]));
    last = re.lastIndex;
  }
  if (last < s.length) node.appendChild(document.createTextNode(s.slice(last)));
}

// ---- קבצים מצורפים (קובצי טקסט: התוכן נשלח יחד עם ההודעה)
const ATT_RE = /\n*\[קובץ מצורף: ([^\]\n]+)\]\n```\n[\s\S]*?(\n```|$)/g;
function splitAtt(t) {
  const files = [];
  const text = String(t).replace(ATT_RE, (_, n) => { files.push(n); return ""; }).trim();
  return { text, files };
}
function fileChip(name, onRemove) {
  const c = el("span", "chip"); c.appendChild(icon(IC.file)); c.appendChild(el("span", "", name));
  if (onRemove) { const x = el("button"); x.type = "button"; x.setAttribute("aria-label", "הסרת " + name); x.appendChild(icon(IC.x)); x.onclick = onRemove; c.appendChild(x); }
  return c;
}
function renderAtts() {
  const box = $("atts"); box.textContent = "";
  atts.forEach((a, i) => box.appendChild(fileChip(a.name, () => { atts.splice(i, 1); renderAtts(); updSend(); })));
  const used = atts.reduce((n, a) => n + a.text.length, 0);
  $("hint").textContent = atts.length ? Math.round(used / 1000) + " מתוך " + MAX_ATT / 1000 + " אלף תווים" : "";
}
async function addFiles(list) {
  for (const f of list) {
    if (f.size > 400000) { toast("הקובץ " + f.name + " גדול מדי"); continue; }
    let text = "";
    try { text = await f.text(); } catch (e) { toast("לא הצלחתי לקרוא את " + f.name); continue; }
    if (/[\x00-\x08\x0e-\x1a]/.test(text.slice(0, 2000))) { toast("אפשר לצרף רק קובצי טקסט (" + f.name + ")"); continue; }
    const used = atts.reduce((n, a) => n + a.text.length, 0);
    if (used + text.length > MAX_ATT) {
      const room = MAX_ATT - used;
      if (room < 200) { toast("הגעת לגודל המרבי של קבצים בהודעה אחת"); break; }
      text = text.slice(0, room); toast("הקובץ " + f.name + " קוצר – הוא ארוך מדי");
    }
    atts.push({ name: f.name.replace(/[\]\n]/g, " "), text });
  }
  renderAtts(); updSend();
}
$("attbtn").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
const cmp = $("compose");
cmp.addEventListener("dragover", (e) => { e.preventDefault(); cmp.classList.add("drag"); });
cmp.addEventListener("dragleave", () => cmp.classList.remove("drag"));
cmp.addEventListener("drop", (e) => { e.preventDefault(); cmp.classList.remove("drag"); addFiles([...e.dataTransfer.files]); });
$("text").addEventListener("paste", (e) => { const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); addFiles(f); } });

// ---- שליחה
function grow() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(240, t.scrollHeight) + "px"; }
function updSend() { $("sendbtn").disabled = sending || (!$("text").value.trim() && !atts.length); }
$("text").addEventListener("input", () => { grow(); updSend(); store.set("claude_draft_" + cur, $("text").value); });
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && innerWidth > 820) { e.preventDefault(); cmp.requestSubmit(); } });
cmp.onsubmit = (e) => { e.preventDefault(); send(); };
async function send(fixed) {
  const t = $("text");
  let text = fixed || t.value.trim();
  if (!fixed && atts.length) text = (text || "מצורף קובץ") + atts.map((a) => "\n\n[קובץ מצורף: " + a.name + "]\n```\n" + a.text + "\n```").join("");
  if (!text || sending) return;
  sending = true; updSend();
  const conv = cur === OLD ? "" : cur;
  const tmp = { id: "tmp" + Date.now(), from: "me", conv, text, at: Date.now(), status: "new" };
  items.push(tmp); render();
  try {
    await api("claude_send", { text, conv });
    if (!fixed) { t.value = ""; atts = []; renderAtts(); grow(); store.set("claude_draft_" + cur, ""); }
    if (meta[cur]?.made) { delete meta[cur].made; saveMeta(); }
    await load();
    // שרת ישן בלי שיחות נפרדות: כל ההודעות בשיחה אחת
    if (items.length && !items.some((m) => "conv" in m) && cur !== OLD) open(OLD);
  } catch (err) {
    items = items.filter((m) => m !== tmp); render(); toast(err.message);
  } finally { sending = false; updSend(); }
}

// ---- טעינה
async function load() {
  let j;
  try { j = await api("claude_history"); } catch (e) { $("status").textContent = e.message; return; }
  items = (j.items || []).map((m) => ({ ...m, at: typeof m.at === "number" ? m.at : new Date(m.at).getTime() }));
  live = !!j.live;
  if (!loaded) {
    // בפעם הראשונה: חוזרים לשיחה האחרונה אם קיימת, אחרת שיחה חדשה
    const list = convList();
    if (!cur || (!list.some((c) => c.id === cur) && !meta[cur]?.made)) {
      if (list.length && Date.now() - list[0].last < 6 * 3600e3) cur = list[0].id; else { cur = newId(); meta[cur] = { made: Date.now() }; saveMeta(); }
      store.set("claude_cur", cur);
    }
    loadDraft();
  }
  render();
  loaded = true;
}
$("newbtn").onclick = () => { startNew(); if (innerWidth <= 820) document.body.classList.add("closed"); };
$("newTop").onclick = startNew;
$("openSide").onclick = () => { document.body.classList.toggle("closed"); store.set("claude_side", !document.body.classList.contains("closed")); };
$("closeSide").onclick = () => { document.body.classList.add("closed"); store.set("claude_side", false); };
$("scrim").onclick = () => document.body.classList.add("closed");
$("q").addEventListener("input", renderSide);
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "o" || e.key === "O")) { e.preventDefault(); startNew(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); document.body.classList.remove("closed"); $("q").focus(); }
});
if (innerWidth > 820 && store.get("claude_side", true)) document.body.classList.remove("closed");
renderHello();
if (token) { load(); setInterval(() => { if (!document.hidden && !sending) load(); }, 6000); }
</script>
