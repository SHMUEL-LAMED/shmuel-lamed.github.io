<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">

<style>
:root{
  --bg:#faf9f5;--side:#f3f1ea;--panel:#fff;--ink:#141413;--ink2:#3d3d3a;--mute:#73726c;--line:#e6e3d8;--line2:#d9d6ca;
  --hover:rgba(20,20,19,.05);--sel:rgba(20,20,19,.08);--acc:#c96442;--acc2:#b0532f;--accink:#fff;--soft:#f5e9e2;
  --user:#f0eee6;--code:#f5f3ec;--bad:#b3261e;--ok:#2e7d4f;--fs:16px;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 4px 18px rgba(20,20,19,.06);--pop:0 10px 34px rgba(20,20,19,.16);
  --serif:ui-serif,Georgia,"Frank Ruehl CLM","Noto Serif Hebrew","David","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#262624;--side:#1f1e1d;--panel:#30302e;--ink:#faf9f5;--ink2:#e2e0d7;--mute:#a6a39a;--line:#3b3a37;--line2:#4a4945;
  --hover:rgba(255,255,255,.05);--sel:rgba(255,255,255,.09);--acc:#d97757;--acc2:#e58c6c;--accink:#fff;--soft:#3a2d27;
  --user:#141413;--code:#1c1c1a;--bad:#f2b8b5;--ok:#7fd4a0;
  --shadow:0 1px 3px rgba(0,0,0,.3);--pop:0 10px 34px rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor}
.ib{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--mute);text-decoration:none;transition:background .15s,color .15s}
.ib:hover{background:var(--hover);color:var(--ink)}
.spark{color:var(--acc);display:inline-grid;flex:none}
.spark svg{fill:currentColor;stroke:none;width:100%;height:100%}

/* סרגל צד */
#side{width:280px;flex:none;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;height:100%;transition:margin .2s,transform .2s}
body.closed #side{margin-inline-start:-280px}
#sidetop{display:flex;align-items:center;gap:8px;padding:12px 12px 4px 10px}
#sidetop .spark{width:22px;height:22px}
#sidetop .name{flex:1;font-family:var(--serif);font-size:21px;letter-spacing:.2px}
#modes{display:flex;gap:4px;margin:8px 10px 4px;padding:3px;background:var(--hover);border-radius:11px}
#modes button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:8px;font-size:14px;color:var(--mute);font-weight:500}
#modes button svg{width:16px;height:16px}
#modes button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.nav{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:7px 10px;border-radius:9px;font-size:14.5px;color:var(--ink2);text-align:start;width:calc(100% - 16px)}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel)}
.nav svg{width:18px;height:18px}
#newbtn{color:var(--acc2);font-weight:600;margin-top:6px}
#newbtn .plus{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;margin-inline-start:-2px}
#newbtn .plus svg{width:14px;height:14px;stroke-width:2.8}
#search{margin:6px 10px 4px;position:relative}
#search input{width:100%;padding:7px 32px 7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);outline:0;font-size:14px}
#search input:focus{border-color:var(--acc)}
#search svg{position:absolute;inset-inline-start:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
#convs{flex:1;overflow-y:auto;padding:0 8px 10px}
.grp{font-size:12px;color:var(--mute);font-weight:600;padding:12px 10px 4px}
.ci{display:flex;align-items:center;border-radius:9px}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--sel)}
.ci>.t{flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:start;padding:7px 10px;font-size:14px}
.ci .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .sub{flex:none;max-width:40%;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.ci .t svg{width:14px;height:14px;color:var(--acc)}
.ci .more{opacity:0;width:30px;height:30px}
.ci:hover .more,.ci.on .more,.ci .more:focus-visible{opacity:1}
.ci .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-inline-end:6px;flex:none}
#sidefoot{border-top:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column}
#sidefoot a{text-decoration:none}
#scrim{display:none}

/* ראשי */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#head{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:54px}
body:not(.closed) #openSide{display:none}
#htitle{min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 8px;border-radius:8px}
#htitle.can:hover{background:var(--hover);cursor:pointer}
#badges{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}
button.tag:hover{color:var(--ink);background:var(--hover)}
.tag svg{width:13px;height:13px}
.tag.ltr span{direction:ltr;unicode-bidi:isolate}
#status{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
#status.on{color:var(--ok)}
#status.on::before{background:var(--ok)}
#scroll{flex:1;overflow-y:auto}
#msgs{max-width:768px;margin:0 auto;padding:12px 20px 28px;display:flex;flex-direction:column;gap:20px}
.day{align-self:center;font-size:12px;color:var(--mute)}
.um{align-self:flex-end;max-width:85%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.um .tags{display:flex;gap:6px;flex-wrap:wrap}
.u{background:var(--user);padding:10px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.u.pend{opacity:.7}
.u.fail{border:1px solid var(--bad)}
.u .att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.uacts{display:flex;align-items:center;gap:2px;opacity:.9}
.um:not(:hover) .uacts .ib{opacity:0}
.um:focus-within .uacts .ib,.um.f .uacts .ib{opacity:1}
.err{color:var(--bad);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;max-width:240px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--acc)}
.chip button{color:var(--mute);display:grid}
.meta{font-size:12px;color:var(--mute);margin:0 6px}
.acts{display:flex;gap:2px;margin-top:4px;align-items:center}
.acts .ib,.uacts .ib{width:30px;height:30px;border-radius:8px}
.acts .ib svg,.uacts .ib svg{width:16px;height:16px}
.a{display:flex;gap:14px;align-items:flex-start}
.a>.spark{width:22px;height:22px;margin-top:3px}
.a .col{flex:1;min-width:0}
.a .body{overflow-wrap:anywhere;font-family:var(--serif);font-size:1.03em;line-height:1.7;color:var(--ink)}
body.sans .a .body{font-family:var(--sans);font-size:1em}
.body>:first-child{margin-top:0}
.body>:last-child{margin-bottom:0}
.body p{margin:0 0 .75em;unicode-bidi:plaintext}
.body h1,.body h2,.body h3,.body h4{font-weight:600;line-height:1.35;margin:1.1em 0 .45em;unicode-bidi:plaintext}
.body h1{font-size:1.35em}.body h2{font-size:1.2em}.body h3{font-size:1.08em}.body h4{font-size:1em}
.body ul,.body ol{margin:.3em 0 .85em;padding-inline-start:1.6em}
.body li{margin:.25em 0}
.body li>ul,.body li>ol{margin:.2em 0}
.body a{color:var(--acc2);text-decoration:underline;text-underline-offset:2px}
.body code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-family:var(--mono);font-size:.86em;direction:ltr;unicode-bidi:isolate}
.cb{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:.7em 0;background:var(--code);direction:ltr;text-align:left}
.cbh{display:flex;align-items:center;justify-content:space-between;padding:3px 6px 3px 14px;font:12px var(--sans);color:var(--mute);border-bottom:1px solid var(--line)}
.cbh button{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:7px;font-size:12px}
.cbh button:hover{background:var(--hover);color:var(--ink)}
.cbh svg{width:14px;height:14px}
.cb pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:.88em;line-height:1.55}
.cb pre code{border:0;padding:0;background:none;font-size:1em}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body blockquote{margin:.5em 0 .8em;padding-inline-start:14px;border-inline-start:3px solid var(--line2);color:var(--ink2)}
.tw{overflow-x:auto;margin:.6em 0 .9em}
.body table{border-collapse:collapse;font-size:.93em;font-family:var(--sans)}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
.body th{background:var(--code);font-weight:600}
.cf{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--acc);background:var(--soft);font-family:var(--sans)}
.cf b{display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{padding:7px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.pri:hover{background:var(--acc2)}
.btn.bad{color:var(--bad)}
.btn svg{width:16px;height:16px}
.edit{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:10px}
.edit textarea{width:100%;min-width:260px;border:0;outline:0;background:none;resize:vertical;min-height:80px}
.edit .row{justify-content:flex-end;margin-top:4px}
.wait{display:flex;gap:14px;align-items:center;color:var(--mute);font-size:14.5px}
.wait .spark{width:22px;height:22px;animation:sp 2.4s infinite ease-in-out}
@keyframes sp{0%,100%{transform:rotate(0) scale(.9);opacity:.6}50%{transform:rotate(90deg) scale(1.05);opacity:1}}

/* פתיחה */
#hello{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 40px;text-align:center;overflow-y:auto}
#hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,5vw,40px);margin:6px 0 4px;display:flex;align-items:center;gap:12px;line-height:1.25}
#hello h1 .spark{width:34px;height:34px}
#sub{color:var(--mute);font-size:15px;margin:0 0 22px}
#composeSlot{width:100%;max-width:680px}
#sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px;margin-top:16px}
#sugg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 13px;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:8px}
#sugg button:hover{background:var(--hover);color:var(--ink)}
#sugg svg{width:16px;height:16px;color:var(--mute)}

/* כתיבה */
#composeWrap{padding:0 16px max(12px,env(safe-area-inset-bottom))}
#composeSlot #composeWrap{padding:0}
#qa{max-width:768px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
#qa .btn{border-radius:999px;padding:5px 12px;font-size:13.5px}
#compose{max-width:768px;margin:0 auto;background:var(--panel);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);padding:12px 12px 8px;transition:border-color .15s;text-align:start}
#compose:focus-within{border-color:color-mix(in srgb,var(--acc) 45%,var(--line2))}
#compose.drag{border-color:var(--acc);border-style:dashed}
#atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
#atts:empty{display:none}
#text{width:100%;resize:none;border:0;outline:0;background:none;max-height:260px;min-height:28px;padding:2px 6px;line-height:1.5;unicode-bidi:plaintext}
#text::placeholder{color:var(--mute)}
#ctools{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
#ctools .sp{flex:1}
#attbtn{width:32px;height:32px;border:1px solid var(--line2);border-radius:9px}
#hint{font-size:12px;color:var(--mute)}
#repoBtn.need{border-color:var(--acc);color:var(--acc2)}
#sendbtn{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center}
#sendbtn:hover{background:var(--acc2)}
#sendbtn:disabled{opacity:.4;cursor:default}
#sendbtn svg{stroke-width:2.4}
#foot{text-align:center;font-size:12px;color:var(--mute);margin-top:6px}

/* פרויקטים */
#projView{flex:1;overflow-y:auto;padding:10px 20px 40px}
.pw{max-width:820px;margin:0 auto}
.pw h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:8px 0 6px}
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.note{color:var(--mute);font-size:14px;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card b{font-weight:600}
.card p{margin:0;color:var(--mute);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small{color:var(--mute);margin-top:auto}
.instr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;white-space:pre-wrap;font-size:14.5px;margin:6px 0 20px;overflow-wrap:anywhere}
.back{color:var(--mute);font-size:14px;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plist button{display:flex;align-items:center;gap:10px;text-align:start;padding:12px 6px;border-bottom:1px solid var(--line)}
.plist button:hover{background:var(--hover)}
.plist .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* תפריט ותיבות */
#menu{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:5px;min-width:190px;max-height:70vh;overflow-y:auto}
#menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:8px 10px;border-radius:8px;font-size:14.5px}
#menu button:hover{background:var(--hover)}
#menu button.bad{color:var(--bad)}
#menu button.cur{font-weight:600}
#menu svg{width:17px;height:17px}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:40;box-shadow:var(--pop);display:flex;gap:14px;align-items:center;max-width:92vw}
#toast button{color:var(--acc);font-weight:600;filter:brightness(1.25)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,94vw);box-shadow:var(--pop);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 6px;font-size:18px;font-weight:600}
dialog .note{margin:0 0 12px}
.fld{display:flex;flex-direction:column;gap:5px;margin:12px 0 0;font-size:14px;color:var(--ink2)}
.fld input[type=text],.fld textarea,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);outline:0;color:var(--ink)}
.fld textarea{resize:vertical;min-height:120px;line-height:1.5}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc)}
.fld small{color:var(--mute);font-size:12.5px}
.fld.chk{flex-direction:row;align-items:center;gap:10px}
.fld.chk input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;direction:ltr}
.chips button:hover{background:var(--hover)}
.keys{margin:14px 0 0;font-size:13.5px;color:var(--mute)}
.keys div{display:flex;justify-content:space-between;padding:3px 0}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;direction:ltr;display:inline-block}
dialog .row{justify-content:flex-end;margin-top:18px}

@media (max-width:820px){
  #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:20;box-shadow:var(--pop);width:min(300px,86vw)}
  body.closed #side{margin:0;transform:translateX(100%);visibility:hidden}
  body:not(.closed) #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  body #openSide{display:grid}
  #head{padding:6px 8px;min-height:50px}
  #status{font-size:0;gap:0}
  #badges .tag{max-width:130px}
  #msgs{padding:8px 14px 22px}
  .um{max-width:92%}
  .a{gap:10px}
  .a>.spark{width:18px;height:18px}
  #composeWrap{padding:0 10px max(10px,env(safe-area-inset-bottom))}
  #projView{padding:8px 14px 30px}
  .uacts .ib{opacity:1!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="closed">
<aside id="side" aria-label="שיחות">
  <div id="sidetop">
    <span class="spark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c.8 5 3.4 7.6 9 9-5.6 1.4-8.2 4-9 9-.8-5-3.4-7.6-9-9 5.6-1.4 8.2-4 9-9z"/></svg></span>
    <span class="name">Claude</span>
    <button class="ib" id="closeSide" title="סגירת הסרגל (Ctrl+.)" aria-label="סגירת הסרגל"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>

const HEAD_RE = /^\[קלוד קוד(?: · מאגר: ([^\]·\n]+?))?(?: · ענף: ([^\]·\n]+?))?\]\n?/;

  if ((m = s.match(PROJ_RE))) { proj = { name: m[1], instr: m[2] }; s = s.slice(m[0].length); }

// ---- Markdown קל לתשובות. בונה DOM בלבד (createElement / textContent), בלי innerHTML מהתוכן
function md(src) {
  const frag = document.createDocumentFragment();
  const L = String(src).replace(/\r/g, "").split("\n");
  let i = 0, list = null, para = null, quote = null;
  const flush = () => { list = para = quote = null; };
  const cells = (s) => s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((x) => x.trim());
  while (i < L.length) {
    const l = L[i]; let m;
    if ((m = l.match(/^\s*(```|~~~)\s*([\w+#.-]*)/))) {
      const fence = m[1], buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(fence)) buf.push(L[i++]);
      i++; flush(); frag.appendChild(codeBlock(buf.join("\n"), m[2])); continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { flush(); const h = el("h" + Math.min(m[1].length, 4)); inline(h, m[2]); frag.appendChild(h); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flush(); frag.appendChild(el("hr")); i++; continue; }
    if (l.includes("|") && i + 1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i + 1])) {
      flush();
      const tw = el("div", "tw"), tb = el("table"), th = el("thead"), tr = el("tr");
      for (const c of cells(l)) { const x = el("th"); inline(x, c); tr.appendChild(x); }
      th.appendChild(tr); tb.appendChild(th);
      const bd = el("tbody"); i += 2;
      while (i < L.length && L[i].includes("|") && L[i].trim()) {
        const r = el("tr"); for (const c of cells(L[i])) { const x = el("td"); inline(x, c); r.appendChild(x); }
        bd.appendChild(r); i++;
      }
      tb.appendChild(bd); tw.appendChild(tb); frag.appendChild(tw); continue;
    }
    if ((m = l.match(/^\s*>\s?(.*)$/))) {
      list = para = null;
      if (!quote) { quote = el("blockquote"); frag.appendChild(quote); } else quote.appendChild(el("br"));
      inline(quote, m[1]); i++; continue;
    }
    if ((m = l.match(/^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/))) {
      const ord = /\d/.test(m[2]), tag = ord ? "OL" : "UL";
      para = quote = null;
      const li = el("li"); inline(li, m[3]);
      if (m[1].length >= 2 && list && list.lastElementChild) {
        const host = list.lastElementChild; let sub = host.lastElementChild;
        if (!sub || sub.tagName !== tag) { sub = el(tag.toLowerCase()); host.appendChild(sub); }
        sub.appendChild(li);
      } else {
        if (!list || list.tagName !== tag) { list = el(tag.toLowerCase()); if (ord && parseInt(m[2], 10) > 1) list.start = parseInt(m[2], 10); frag.appendChild(list); }
        list.appendChild(li);
      }
      i++; continue;
    }
    if (list && /^\s{2,}\S/.test(l)) { const li = list.lastElementChild; if (li) { li.appendChild(el("br")); inline(li, l.trim()); } i++; continue; }
    list = quote = null;
    if (!para) { para = el("p"); frag.appendChild(para); } else para.appendChild(el("br"));
    inline(para, l); i++;
  }
  return frag;
}
function codeBlock(code, lang) {
  const w = el("div", "cb"), h = el("div", "cbh"); h.appendChild(el("span", "", lang || "code"));
  const b = el("button"); b.type = "button"; b.append(icon(IC.copy), el("span", "", "העתקה"));
  b.onclick = () => { copy(code, null); b.lastChild.textContent = "הועתק"; setTimeout(() => { b.lastChild.textContent = "העתקה"; }, 1500); };
  h.appendChild(b);
  const pre = el("pre"); pre.appendChild(el("code", "", code));
  w.append(h, pre); return w;
}
const IRE = /`([^`]+)`|\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|\[([^\]]+)\]\(\s*(https?:\/\/[^\s)]+)\s*\)|(https?:\/\/[^\s<>"']*[^\s<>"'.,;:!?)\]])|\*([^*\s](?:[^*]*[^*\s])?)\*/g;
function inline(node, s) {
  const re = new RegExp(IRE.source, "g");
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) node.appendChild(document.createTextNode(s.slice(last, m.index)));
    if (m[1] != null) node.appendChild(el("code", "", m[1]));
    else if (m[2] != null || m[3] != null) { const b = el("strong"); inline(b, m[2] != null ? m[2] : m[3]); node.appendChild(b); }
    else if (m[4] != null) { const b = el("del"); inline(b, m[4]); node.appendChild(b); }
    else if (m[5] != null) node.appendChild(link(m[6], m[5]));
    else if (m[7] != null) node.appendChild(link(m[7], m[7]));
    else { const b = el("em"); inline(b, m[8]); node.appendChild(b); }
    last = re.lastIndex;
  }
  if (last < s.length) node.appendChild(document.createTextNode(s.slice(last)));
}
function link(href, text) {
  const a = el("a", "", text);
  try { const u = new URL(href); if (u.protocol === "https:" || u.protocol === "http:") { a.href = u.href; a.target = "_blank"; a.rel = "noopener noreferrer"; } } catch (e) {}
  return a;
}

// ---- קבצים מצורפים (קובצי טקסט בלבד: התוכן נשלח בתוך ההודעה)
function fileChip(name, onRemove) {
  const c = el("span", "chip"); c.appendChild(icon(IC.file)); c.appendChild(el("span", "", name));
  if (onRemove) { const x = el("button"); x.type = "button"; x.setAttribute("aria-label", "הסרת " + name); x.appendChild(icon(IC.x)); x.onclick = onRemove; c.appendChild(x); }
  return c;
}
function renderAtts() {
  const box = $("atts"); box.textContent = "";
  atts.forEach((a, i) => box.appendChild(fileChip(a.name, () => { atts.splice(i, 1); renderAtts(); updSend(); })));
  const used = atts.reduce((n, a) => n + a.text.length, 0);
  $("hint").textContent = atts.length ? Math.round(used / 1000) + " מתוך " + MAX_ATT / 1000 + " אלף תווים" : "";
}
async function addFiles(list) {
  for (const f of list) {
    if (/^(image|video|audio)\//.test(f.type)) { toast("אפשר לצרף רק קובצי טקסט – תמונות לא נתמכות כאן"); continue; }
    if (f.size > 400000) { toast("הקובץ " + f.name + " גדול מדי"); continue; }
    let text = "";
    try { text = await f.text(); } catch (e) { toast("לא הצלחתי לקרוא את " + f.name); continue; }
    if (/[\x00-\x08\x0e-\x1a]/.test(text.slice(0, 2000))) { toast("אפשר לצרף רק קובצי טקסט (" + f.name + ")"); continue; }
    const used = atts.reduce((n, a) => n + a.text.length, 0);
    if (used + text.length > MAX_ATT) {
      const room = MAX_ATT - used;
      if (room < 200) { toast("הגעת לגודל המרבי של קבצים בהודעה אחת"); break; }
      text = text.slice(0, room); toast("הקובץ " + f.name + " קוצר – הוא ארוך מדי");
    }
    atts.push({ name: f.name.replace(/[\]\n]/g, " "), text });
  }
  renderAtts(); updSend();
}
$("attbtn").onclick = () => $("file").click();
$("file").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
const cmp = $("compose");
cmp.addEventListener("dragover", (e) => { e.preventDefault(); cmp.classList.add("drag"); });
cmp.addEventListener("dragleave", () => cmp.classList.remove("drag"));
cmp.addEventListener("drop", (e) => { e.preventDefault(); cmp.classList.remove("drag"); addFiles([...e.dataTransfer.files]); });
$("text").addEventListener("paste", (e) => { const f = [...((e.clipboardData && e.clipboardData.files) || [])]; if (f.length) { e.preventDefault(); addFiles(f); } });

// ---- שליחה
function grow() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(260, t.scrollHeight) + "px"; }
function updSend() { $("sendbtn").disabled = sending || (!$("text").value.trim() && !atts.length); }
$("text").addEventListener("input", () => { grow(); updSend(); store.set("claude_draft_" + cur, $("text").value); });
$("text").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
  if (e.ctrlKey || e.metaKey || (prefs.enter && !coarse)) { e.preventDefault(); cmp.requestSubmit(); }
});
cmp.onsubmit = (e) => {
  e.preventDefault();
  if (sending) return;
  const t = $("text"); let body = t.value.trim();
  if (atts.length) body = (body || "מצורף קובץ") + atts.map((a) => "\n\n[קובץ מצורף: " + a.name + "]\n```\n" + a.text + "\n```").join("");
  if (!body) return;
  t.value = ""; atts = []; renderAtts(); grow(); store.set("claude_draft_" + cur, "");
  send(body);
};
// ההנחיות של הפרויקט נשלחות פעם אחת בכל שיחה (ושוב אם השתנו), בתוך סימון ברור
function instrFor(id) {
  const p = projOf(id); if (!p || !String(p.instr || "").trim()) return null;
  const key = p.id + ":" + hash(p.instr);
  return (meta[id] || {}).isent === key ? null : { p, key };
}
function outgoing(id, body) {
  let t = body, key = "";
  const ins = instrFor(id);
  if (ins) { t = "[הנחיות הפרויקט: " + clean(ins.p.name) + "]\n" + ins.p.instr.trim() + "\n[סוף ההנחיות]\n\n" + t; key = ins.key; }
  if (convMode(id) === "code") {
    const r = getRepo(id);
    t = "[קלוד קוד" + (r.repo ? " · מאגר: " + r.repo : "") + (r.branch ? " · ענף: " + r.branch : "") + "]\n" + t;
  }
  return { text: t, key };
}
async function send(body, o) {
  o = o || {};
  if (sending) { toast("רגע, הודעה קודמת עדיין נשלחת"); return; }
  const cid = cur, conv = cid === OLD ? "" : cid;
  let text = body, key = o.key || "";
  if (!o.plain) ({ text, key } = outgoing(cid, body));
  if (!String(text).trim()) return;
  sending = true; updSend();
  const tmp = { id: "tmp" + Date.now(), from: "me", conv, text, at: Date.now(), status: "new" };
  items.push(tmp); sig = ""; render();
  const sc = $("scroll"); sc.scrollTop = sc.scrollHeight;
  try {
    await api("claude_send", { text, conv });
    const x = (meta[cid] = meta[cid] || {});
    if (key) x.isent = key;
    if (!x.mode) x.mode = convMode(cid);
    delete x.made; saveMeta();
    sending = false;
    await load();
    // שרת ישן בלי שיחות נפרדות: כל ההודעות בשיחה אחת
    if (items.length && !items.some((m) => "conv" in m) && cur !== OLD) openConv(OLD);
  } catch (err) {
    items = items.filter((m) => m !== tmp);
    failed.push({ id: "f" + Date.now(), conv: cid, text, key, at: tmp.at, err: err.message });
    sig = ""; render(); toast(err.message);
  } finally { sending = false; updSend(); }
}

// ---- טעינה
async function load() {
  let j;
  try { j = await api("claude_history"); } catch (e) { $("status").textContent = e.message; return; }
  items = (j.items || []).map((m) => ({ ...m, text: String(m.text == null ? "" : m.text), at: typeof m.at === "number" ? m.at : new Date(m.at).getTime() }));
  live = !!j.live;
  if (!loaded) {
    const list = convList();
    if (!cur || (!list.some((c) => c.id === cur) && !(meta[cur] && meta[cur].made))) {
      if (list.length && Date.now() - list[0].last < 6 * 3600e3) cur = list[0].id;
      else { cur = newId(); meta[cur] = { made: Date.now(), mode }; if (mode === "code") Object.assign(meta[cur], lastRepo()); saveMeta(); }
      store.set("claude_cur", cur);
    }
    mode = convMode(cur);
    loadDraft();
  }
  render();
  loaded = true;
}
function closeSide() { document.body.classList.add("closed"); if (innerWidth > 820) store.set("claude_side", false); }
function toggleSide() { document.body.classList.toggle("closed"); if (innerWidth > 820) store.set("claude_side", !document.body.classList.contains("closed")); }
for (const b of $("modes").children) b.onclick = () => { setMode(b.dataset.mode); if (innerWidth <= 820) closeSide(); };

document.addEventListener("keydown", (e) => {

if (innerWidth > 820 && store.get("claude_side", true)) document.body.classList.remove("closed");
