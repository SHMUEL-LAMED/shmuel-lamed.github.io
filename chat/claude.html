<style>
:root{
  --bg:#fff;--side:#fafafa;--panel:#fff;--ink:rgba(0,0,0,.9);--ink2:rgba(0,0,0,.6);--mute:rgba(0,0,0,.47);--ph:#878787;--line:rgba(0,0,0,.1);--line2:rgba(0,0,0,.12);--hair:rgba(0,0,0,.08);
  --hover:rgba(0,0,0,.05);--hover2:rgba(0,0,0,.075);--sel:rgba(0,0,0,.1);--acc:#c6613f;--acc2:#d97757;--accink:#fff;--soft:rgba(210,95,37,.14);--clay:#d97757;
  --user:rgba(11,11,11,.05);--code:rgba(0,0,0,.05);--card:rgba(0,0,0,.035);--cardh:rgba(0,0,0,.06);--bad:#a42528;--ok:#10a122;--link:#1757ac;--pri:#191919;--prih:#3c3c3c;--priink:#fff;--solid:#191919;--pre:#14181f;--dis:rgba(0,0,0,.4);--okfill:#10a122;--jumpbg:#fff;--cbbg:rgba(255,255,255,.5);--field:rgba(255,255,255,.5);--fs:15px;
  --shadow:0 4px 20px rgba(0,0,0,.035),0 0 0 1px rgba(0,0,0,.12);--shadowf:0 4px 20px rgba(0,0,0,.075),0 0 0 1px rgba(0,0,0,.12);
  --pop:0 0 0 1px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.08);
  --md:0 2px 4px rgba(11,11,11,.07),0 6px 16px rgba(11,11,11,.08);
  --dlg:0 0 0 1px rgba(0,0,0,.08),0 4px 8px rgba(11,11,11,.08),0 12px 28px -2px rgba(11,11,11,.08);
  --ez:cubic-bezier(.4,0,.2,1);--ez2:cubic-bezier(.165,.84,.44,1);
  --serif:ui-serif,Georgia,"Frank Ruehl CLM","Noto Serif Hebrew","David","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#191919;--side:#1f1f1f;--panel:#303030;--ink:rgba(255,255,255,.93);--ink2:rgba(255,255,255,.57);--mute:rgba(255,255,255,.4);--ph:#878787;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.12);--hair:rgba(255,255,255,.04);
  --hover:rgba(255,255,255,.075);--hover2:rgba(255,255,255,.1);--sel:rgba(255,255,255,.15);--soft:rgba(210,95,37,.12);--dis:rgba(255,255,255,.4);--jumpbg:#1f1f1f;--cbbg:rgba(31,31,31,.5);--field:rgba(255,255,255,.05);
  --user:rgba(255,255,255,.05);--code:rgba(255,255,255,.075);--card:rgba(255,255,255,.03);--cardh:rgba(255,255,255,.05);--bad:#f17778;--ok:#53c556;--link:#6aabf1;--pri:#efefef;--prih:#d7d7d7;--priink:#191919;--solid:#efefef;--pre:#eaecf0;
  --shadow:0 4px 20px rgba(0,0,0,.035),inset 0 0 0 1px rgba(255,255,255,.08);--shadowf:0 4px 20px rgba(0,0,0,.075),inset 0 0 0 1px rgba(255,255,255,.08);
  --pop:inset 0 0 0 1px rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.32),0 2px 6px rgba(0,0,0,.2);
  --md:0 2px 4px rgba(11,11,11,.07),0 6px 16px rgba(0,0,0,.24);--dlg:inset 0 0 0 1px rgba(255,255,255,.04),0 4px 8px rgba(0,0,0,.24),0 12px 28px -2px rgba(0,0,0,.32);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.4;display:flex;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.fill{fill:currentColor}
.ib{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--mute);text-decoration:none;transition:background .06s var(--ez),color .06s var(--ez)}
.ib:hover{background:var(--hover);color:var(--ink)}
.spark{color:var(--clay);display:inline-grid;flex:none}
.spark svg{fill:currentColor;stroke:none;width:100%;height:100%}

/* סרגל צד לפי המדידה: 288 פיקסלים, שורות של 32, כותרות קבוצה של 12. כשהוא סגור – נעלם, ונשאר רק כפתור הפתיחה */
#side{width:288px;flex:none;background:var(--side);border-inline-end:.8px solid var(--line);display:flex;flex-direction:column;height:100%;font-size:14px;line-height:21px;overflow:hidden}
#sidetop{display:flex;align-items:center;gap:8px;padding:4px 10px 5px;height:54px;flex:none}
#sidetop .ib{width:32px;height:32px}
#sidetop .name{flex:1;font-family:var(--serif);font-size:26px;font-weight:500;white-space:nowrap;line-height:1}
#modes{display:flex;gap:0;margin:0;flex:none;padding:2px;height:34px;background:var(--user);border-radius:9px}
#modes button{flex:none;width:40px;display:grid;place-items:center;height:30px;border-radius:7px;color:var(--ink2)}
#modes button svg{width:18px;height:18px}
#newbtn{margin-top:4px}
#modes button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.06)}
.nav{display:flex;align-items:center;gap:8px;margin:0 10px 2px;padding:0 8px;height:40px;border-radius:8px;font-size:16px;color:var(--ink);text-align:start;width:calc(100% - 20px);white-space:nowrap;text-decoration:none;flex:none}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel)}
.nav svg{width:20px;height:20px}
.nav>.ic{width:26px;height:26px;display:grid;place-items:center;flex:none}
#convs{flex:1;overflow-y:auto;padding:4px 10px 6px;min-height:0}
.grp{display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;color:var(--ink2);padding:22px 12px 10px;width:100%;text-align:start}
.grp svg{width:12px;height:12px;transition:transform .15s var(--ez)}
.grp.shut svg{transform:rotate(-90deg)}
html[dir=rtl] .grp.shut svg{transform:rotate(90deg)}
.grp:first-child{padding-top:14px}
.ci{display:flex;align-items:center;border-radius:8px;height:40px;margin-bottom:2px}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--sel)}
.ci>.t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:start;padding:0 12px;font-size:16px;height:40px}
.ci .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start}
html[dir=ltr] .ci .tt,html[dir=ltr] .plist .tt,html[dir=ltr] #htitle{text-align:left}
.ci .t>svg{width:18px;height:18px;flex:none}
.ci .sub{flex:none;max-width:40%;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.ci .more{opacity:0;width:28px;height:28px;margin-inline-end:2px}
.ci:hover .more,.ci.on .more,.ci .more:focus-visible{opacity:1}
.ci .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);margin-inline-end:6px;flex:none}
#viewAll{display:block;width:100%;text-align:start;height:36px;padding:0 12px;border-radius:8px;font-size:14px;color:var(--ink2)}
#viewAll:hover{background:var(--hover);color:var(--ink)}
#sidefoot{padding:8px 12px 10px;display:flex;align-items:center;justify-content:space-between;border-top:.8px solid var(--line)}
#sidefoot .ib{width:32px;height:32px;color:var(--ink)}
#sidefoot .ib svg{width:20px;height:20px}
#me{display:inline-flex;align-items:center;gap:8px;height:36px;max-width:calc(100% - 40px);padding:0 10px 0 4px;border-radius:8px;font-size:16px}
#me:hover{background:var(--hover)}
.av{width:26px;height:26px;border-radius:50%;background:var(--solid);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
#me b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me>svg{width:12px;height:12px;color:var(--ink2)}
#me small{font-size:14px;color:var(--ink2);white-space:nowrap}
#meSub{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none;font-size:0}
#meSub.on{background:var(--okfill)}
#scrim{display:none}
@media (min-width:821px){body.closed #side{display:none}}

/* ראשי */
#main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
#head{display:flex;align-items:center;gap:0;padding:0 14px;height:56px;flex:none;font-size:16px}
#head>.ib{width:32px;height:32px}
#head>#hmore{width:28px;height:28px;color:var(--ink)}
#head>#hmore svg{width:14px;height:14px}
#openSide{position:relative;top:-.5px}
#openSide{margin-inline-end:6px}
body.closed #openSide{display:grid}
#openSide,#newTop{display:none}
#htitle{min-width:0;max-width:55%;height:36px;padding:0 10px;border-radius:8px;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#htitle:hover{background:var(--hover)}
#hname{min-width:120px;width:min(360px,55%);height:28px;padding:0 10px;margin:0 2px;border-radius:7px;border:0;outline:0;background:var(--field);box-shadow:inset 0 0 0 1px var(--bg),0 0 0 1px #257de0,0 0 6px 1px rgba(23,87,172,.6);font-size:14px;line-height:20px}
#hmore{margin-inline-start:-4px}
#badges{margin-inline-start:6px;display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}
button.tag:hover{color:var(--ink);background:var(--hover)}
.tag svg{width:13px;height:13px}
.tag.ltr span{direction:ltr;unicode-bidi:isolate}
#status{display:none;font-size:13px;color:var(--mute);align-items:center;gap:6px;white-space:nowrap}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
#status.err{display:flex;align-items:center;gap:6px;color:var(--bad)}
#status.on{color:var(--ok)}
#status.on::before{background:var(--okfill)}
#scroll{flex:1;overflow-y:auto}
#msgs{max-width:768px;margin:0 auto;padding:4px 16px 48px;display:flex;flex-direction:column;gap:16px}
.um{align-self:flex-end;max-width:85%;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.um .tags{display:flex;gap:6px;flex-wrap:wrap}
.u{background:var(--user);padding:8px 16px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start}
.u.pend{opacity:.7}
.u.fail{border:1px solid var(--bad)}
.u .att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.uacts{display:flex;align-items:center;gap:2px;opacity:.9}
.um:not(:hover) .uacts .ib{opacity:0}
.um:focus-within .uacts .ib,.um.f .uacts .ib{opacity:1}
.err{color:var(--bad);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;max-width:240px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--acc)}
.chip button{color:var(--mute);display:grid}
.meta{font-size:12px;color:var(--mute);margin:0 6px}
.acts{display:flex;gap:0;margin-top:8px;margin-inline-start:-2px;align-items:center;height:24px}
.acts .ib,.uacts .ib{width:24px;height:24px;border-radius:6px;color:var(--ink2)}
.acts .ib svg,.uacts .ib svg{width:16px;height:16px}
.a{padding:0}
.a .col{min-width:0}
.a:not(.last) .acts{opacity:0;transition:opacity .15s}
.a:hover .acts,.a:focus-within .acts{opacity:1}
.mark{display:flex;align-items:center;gap:12px;padding:6px 4px 0;color:var(--mute);font-size:14.5px}
.mark .spark{width:26px;height:26px}
.mark.wait .spark{animation:sp 2.4s infinite ease-in-out}
.a .body{overflow-wrap:anywhere;line-height:1.4;color:var(--ink)}
body:not(.sans) .a .body{font-family:var(--serif);font-size:1.06em;line-height:1.6}
.body>:first-child{margin-top:0}
.body>:last-child{margin-bottom:0}
.body p{margin:0 0 .75em;padding-inline:4px 56px}
.body h1,.body h2,.body h3,.body h4{font-weight:600;line-height:1.35;margin:1.1em 0 .45em;unicode-bidi:plaintext}
.body h1{font-size:1.35em}.body h2{font-size:1.2em}.body h3{font-size:1.08em}.body h4{font-size:1em}
.body ul,.body ol{margin:.75em 0;padding-inline-start:30px}
.body li{margin:.2em 0;padding-inline-start:4px}
.body li>ul,.body li>ol{margin:.2em 0}
.body a{color:var(--link);text-decoration:underline;text-underline-offset:2px;border-radius:2px;transition:color .06s var(--ez2)}
.body code{background:var(--code);border-radius:4px;padding:1px 4px;font-family:var(--mono);font-size:.9em;direction:ltr;unicode-bidi:isolate}
.cb{position:relative;border-radius:12px;margin:.75em 0;background:var(--cbbg);border:.8px solid var(--hair);direction:ltr;text-align:left}
.cb>button{position:absolute;top:10px;right:8px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink);opacity:0;transition:opacity .15s var(--ez)}
.cb:hover>button,.cb>button:focus-visible{opacity:1}
.cb>button:hover{background:var(--hover);color:var(--ink)}
.cb>button svg{width:16px;height:16px}
.cb pre{margin:0;padding:14px;overflow-x:auto;font-size:14px;line-height:22.75px;color:var(--pre)}
.cb pre code{padding:0;background:none;font-size:1em}
.body hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.body blockquote{margin:.5em 0 .8em;padding-inline-start:14px;border-inline-start:3px solid var(--line2);color:var(--ink2)}
.tw{overflow-x:auto;margin:.6em 0 .9em}
.body table{border-collapse:collapse;font-size:.93em;font-family:var(--sans)}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:start;vertical-align:top}
.body th{background:var(--code);font-weight:600}
.cf{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--acc);background:var(--soft);font-family:var(--sans)}
.cf b{display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{height:28px;padding:0 9px;border-radius:8px;border:0;box-shadow:0 0 0 1px var(--line2);background:var(--panel);font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:box-shadow .06s var(--ez)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri);box-shadow:none;color:var(--priink)}
.btn.pri:hover{background:var(--prih)}
.btn.bad{color:var(--bad)}
.btn svg{width:16px;height:16px}
.edit{width:100%;max-width:600px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:10px}
.edit textarea{width:100%;min-width:260px;border:0;outline:0;background:none;resize:vertical;min-height:80px}
.edit .row{justify-content:flex-end;margin-top:4px}
@keyframes sp{0%,100%{transform:rotate(0) scale(.9);opacity:.6}50%{transform:rotate(90deg) scale(1.05);opacity:1}}

.tabs{display:flex;gap:2px;padding:0 12px;margin:20px 0 4px}
.tabs button{height:28px;padding:0 12px;border-radius:8px;font-size:14px;color:var(--ink2)}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected=true]{background:var(--sel);color:var(--ink)}
.prow{display:flex;align-items:center;border-radius:8px}
.prow:hover{background:var(--hover)}
.plist .prow>button:first-child{flex:1;min-width:0}
.plist .prow>button:first-child:hover{background:none}
.plist .ib{padding:0;min-height:0;width:28px;height:28px;display:grid;flex:none;margin-inline-end:10px;color:var(--ink)}
.ptop .hb{display:flex;align-items:center;gap:4px}
.ptop .hb .ib{color:var(--ink)}
.acts .ib.on{color:var(--ink);background:var(--hover)}
#dictBtn{width:28px;height:28px;border-radius:8px;color:var(--ink)}
#dictBtn.on{color:#fff;background:var(--acc)}
#modeBtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;font-size:14px;color:var(--ink);white-space:nowrap}
#modeBtn:hover{background:var(--hover)}
#modeBtn svg{width:12px;height:12px;color:var(--ink2)}
body.inchat #modeBtn{display:none}
body.inchat #dictBtn{order:1}
#menu button .k{margin-inline-start:auto;padding-inline-start:16px;color:var(--mute);font-size:12px;direction:ltr}
#menu button.cur::after{content:"✓";margin-inline-start:auto;padding-inline-start:12px}
.nav.soon{color:var(--ink)}
#jump{position:absolute;inset-inline:0;margin:0 auto;bottom:76px;width:36px;height:36px;padding:4px;border-radius:50%;background:color-mix(in srgb,var(--jumpbg) 80%,transparent);border:.8px solid var(--hair);box-shadow:var(--md);display:grid;place-items:center;z-index:5;transition:opacity .2s var(--ez)}
#jump svg{width:18px;height:18px}
#main{position:relative}

/* פתיחה */
#hello{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 40px;text-align:center;overflow-y:auto}
#hello h1{font-family:var(--serif);font-weight:400;font-size:38px;color:var(--ink);margin:0 0 36px;display:flex;align-items:center;gap:14.4px;line-height:47.5px}
#hello h1 .spark{width:27.35px;height:27.35px}
#hello h1 .spark svg{transform:scale(1.335)}
#sub{color:var(--ink2);font-size:14px;margin:-12px 0 16px}
#sub:empty{display:none}
#composeSlot{width:100%;max-width:656px}
#composeSlot #text{min-height:51px}
#sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:656px;margin-top:16px}

// ---- Markdown קל לתשובות. בונה DOM בלבד (createElement / textContent), בלי innerHTML מהתוכן
function md(src) {
  const frag = document.createDocumentFragment();
  const L = String(src).replace(/\r/g, "").split("\n");
  let i = 0, list = null, para = null, quote = null;
  const flush = () => { list = para = quote = null; };
  const cells = (s) => s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((x) => x.trim());
  while (i < L.length) {
    const l = L[i]; let m;
    if ((m = l.match(/^\s*(```|~~~)\s*([\w+#.-]*)/))) {
      const fence = m[1], buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(fence)) buf.push(L[i++]);
      i++; flush(); frag.appendChild(codeBlock(buf.join("\n"), m[2])); continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { flush(); const h = el("h" + Math.min(m[1].length, 4)); h.dir = "auto"; inline(h, m[2]); frag.appendChild(h); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) { flush(); frag.appendChild(el("hr")); i++; continue; }
    if (l.includes("|") && i + 1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i + 1])) {
      flush();
      const tw = el("div", "tw"), tb = el("table"); tw.dir = "auto"; const th = el("thead"), tr = el("tr");
      for (const c of cells(l)) { const x = el("th"); inline(x, c); tr.appendChild(x); }
      th.appendChild(tr); tb.appendChild(th);
      const bd = el("tbody"); i += 2;
      while (i < L.length && L[i].includes("|") && L[i].trim()) {
        const r = el("tr"); for (const c of cells(L[i])) { const x = el("td"); inline(x, c); r.appendChild(x); }
        bd.appendChild(r); i++;
      }
      tb.appendChild(bd); tw.appendChild(tb); frag.appendChild(tw); continue;
    }
    if ((m = l.match(/^\s*>\s?(.*)$/))) {
      list = para = null;
      if (!quote) { quote = el("blockquote"); quote.dir = "auto"; frag.appendChild(quote); } else quote.appendChild(el("br"));
      inline(quote, m[1]); i++; continue;
    }
    if ((m = l.match(/^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/))) {
      const ord = /\d/.test(m[2]), tag = ord ? "OL" : "UL";
      para = quote = null;
      const li = el("li"); inline(li, m[3]);
      if (m[1].length >= 2 && list && list.lastElementChild) {
        const host = list.lastElementChild; let sub = host.lastElementChild;
        if (!sub || sub.tagName !== tag) { sub = el(tag.toLowerCase()); host.appendChild(sub); }
        sub.appendChild(li);
      } else {
        if (!list || list.tagName !== tag) { list = el(tag.toLowerCase()); list.dir = "auto"; if (ord && parseInt(m[2], 10) > 1) list.start = parseInt(m[2], 10); frag.appendChild(list); }
        list.appendChild(li);
      }
      i++; continue;
    }
    if (list && /^\s{2,}\S/.test(l)) { const li = list.lastElementChild; if (li) { li.appendChild(el("br")); inline(li, l.trim()); } i++; continue; }
    list = quote = null;
    if (!para) { para = el("p"); para.dir = "auto"; frag.appendChild(para); } else para.appendChild(el("br"));
    inline(para, l); i++;
  }
  return frag;
}
function codeBlock(code, lang) {

const IRE = /`([^`]+)`|\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|\[([^\]]+)\]\(\s*(https?:\/\/[^\s)]+)\s*\)|(https?:\/\/[^\s<>"']*[^\s<>"'.,;:!?)\]])|\*([^*\s](?:[^*]*[^*\s])?)\*/g;
function inline(node, s) {
  const re = new RegExp(IRE.source, "g");
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) node.appendChild(document.createTextNode(s.slice(last, m.index)));
    if (m[1] != null) node.appendChild(el("code", "", m[1]));
    else if (m[2] != null || m[3] != null) { const b = el("strong"); inline(b, m[2] != null ? m[2] : m[3]); node.appendChild(b); }
    else if (m[4] != null) { const b = el("del"); inline(b, m[4]); node.appendChild(b); }
    else if (m[5] != null) node.appendChild(link(m[6], m[5]));
    else if (m[7] != null) node.appendChild(link(m[7], m[7]));
    else { const b = el("em"); inline(b, m[8]); node.appendChild(b); }
    last = re.lastIndex;

async function addFiles(list) {

    if (f.size > 400000) { toast("הקובץ " + f.name + " גדול מדי"); continue; }
    let text = "";
    try { text = await f.text(); } catch (e) { toast("לא הצלחתי לקרוא את " + f.name); continue; }
    if (/[\x00-\x08\x0e-\x1a]/.test(text.slice(0, 2000))) { toast("אפשר לצרף רק קובצי טקסט (" + f.name + ")"); continue; }
    const used = atts.reduce((n, a) => n + a.text.length, 0);

      text = text.slice(0, room); toast("הקובץ " + f.name + " קוצר – הוא ארוך מדי");

}

  return (meta[id] || {}).isent === key ? null : { p, key };
}
function outgoing(id, body) {
  let t = body, key = "";
  const ins = instrFor(id);
  if (ins) { t = "[הנחיות הפרויקט: " + clean(ins.p.name) + "]\n" + ins.p.instr.trim() + "\n[סוף ההנחיות]\n\n" + t; key = ins.key; }
  if (convMode(id) === "code") {
    const r = getRepo(id);
    t = "[קלוד קוד" + (r.repo ? " · מאגר: " + r.repo : "") + (r.branch ? " · ענף: " + r.branch : "") + "]\n" + t;
  }
  return { text: t, key };
}
async function send(body, o) {
  o = o || {};
  if (sending) { toast("רגע, הודעה קודמת עדיין נשלחת"); return; }
  const cid = cur, conv = cid === OLD ? "" : cid;
  let text = body, key = o.key || "";
  if (!o.plain) ({ text, key } = outgoing(cid, body));
  if (!String(text).trim()) return;
  sending = true; updSend();
  const tmp = { id: "tmp" + Date.now(), from: "me", conv, text, at: Date.now(), status: "new" };
  items.push(tmp); sig = ""; render();
  const sc = $("scroll"); sc.scrollTop = sc.scrollHeight;
  try {
    await api("claude_send", { text, conv });
    const x = (meta[cid] = meta[cid] || {});
    if (key) x.isent = key;
    if (!x.mode) x.mode = convMode(cid);
    delete x.made; saveMeta();
    sending = false;
    await load();
    // שרת ישן בלי שיחות נפרדות: כל ההודעות בשיחה אחת
    if (items.length && !items.some((m) => "conv" in m) && cur !== OLD) openConv(OLD);
  } catch (err) {
    items = items.filter((m) => m !== tmp);
    failed.push({ id: "f" + Date.now(), conv: cid, text, key, at: tmp.at, err: err.message });
    sig = ""; render(); toast(err.message);
  } finally { sending = false; updSend(); }
}

// ---- טעינה
async function load() {
  let j;
  try { j = await api("claude_history"); } catch (e) { const st = $("status"); st.textContent = e.message; st.className = "err"; $("me").title = e.message; return; }
  items = (j.items || []).map((m) => ({ ...m, text: String(m.text == null ? "" : m.text), at: typeof m.at === "number" ? m.at : new Date(m.at).getTime() }));
  live = !!j.live;
  if (!loaded) {
    const list = convList();
    if (!cur || (!list.some((c) => c.id === cur) && !(meta[cur] && meta[cur].made))) {
      if (list.length && Date.now() - list[0].last < 6 * 3600e3) cur = list[0].id;
      else { cur = newId(); meta[cur] = { made: Date.now(), mode }; if (mode === "code") Object.assign(meta[cur], lastRepo()); saveMeta(); }
      store.set("claude_cur", cur);
    }
    mode = convMode(cur);
    loadDraft();
  }
  render();
  loaded = true;
}
// כפתור "מעבר לסוף השיחה": מופיע כשגוללים למעלה
function updJump() {
  const sc = $("scroll"), far = !sc.classList.contains("hide") && sc.scrollHeight - sc.scrollTop - sc.clientHeight > 160;
  $("jump").classList.toggle("hide", !far);
  $("jump").style.bottom = ($("composeWrap").offsetHeight + 16) + "px";
}
$("scroll").addEventListener("scroll", updJump, { passive: true });
$("jump").onclick = () => { const sc = $("scroll"); sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" }); };
function closeSide() { document.body.classList.add("closed"); if (innerWidth > 820) store.set("claude_side", false); }
function toggleSide() { document.body.classList.toggle("closed"); if (innerWidth > 820) store.set("claude_side", !document.body.classList.contains("closed")); }
for (const b of $("modes").children) b.onclick = () => { setMode(b.dataset.mode); if (innerWidth <= 820) closeSide(); };
$("newbtn").onclick = () => { startNew(); if (innerWidth <= 820) closeSide(); };
$("newTop").onclick = () => startNew();
$("projNav").onclick = () => { view = "projects"; render(); if (innerWidth <= 820) closeSide(); };
$("searchNav").onclick = () => openChats(true);
$("me").onclick = (e) => {
  e.stopPropagation();
  showMenu($("me"), [
    ["הגדרות", IC.gear, () => { if (innerWidth <= 820) closeSide(); openSettings(); }],
    ["חזרה לצ'אטים", IC.back, () => { location.href = "./"; }],
    null,
    ["יציאה מהחשבון", IC.out, () => {
      if (!confirm("לצאת מהחשבון באתר?")) return;
      api("logout", {}).catch(() => {}).finally(() => { try { localStorage.removeItem("chat_token"); } catch (x) {} location.replace("./"); });
    }],
  ]);
};
for (const b of document.querySelectorAll(".nav.soon")) b.onclick = () => toast(b.dataset.soon + " – עדיין לא מחובר באתר הזה");
$("custNav").onclick = () => { if (innerWidth <= 820) closeSide(); openSettings(); };
$("setBtn").onclick = () => { if (innerWidth <= 820) closeSide(); openSettings(); };
$("openSide").onclick = toggleSide;
$("closeSide").onclick = toggleSide;
$("scrim").onclick = closeSide;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    hideMenu(true);
    // בטלפון הסרגל הוא שכבה: Escape סוגר אותו ומחזיר את המיקוד לכפתור שפתח אותו
    if (innerWidth <= 820 && !document.body.classList.contains("closed") && !$("dlg").open) { closeSide(); $("openSide").focus(); }
  }
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  if (e.shiftKey && e.code === "KeyO") { e.preventDefault(); startNew(); }
  else if (!e.shiftKey && e.code === "KeyU" && view === "chat") { e.preventDefault(); $("file").click(); }
  else if (!e.shiftKey && e.code === "KeyK") { e.preventDefault(); openChats(true); }
  else if (!e.shiftKey && e.code === "Period") { e.preventDefault(); toggleSide(); }
});
applyPrefs();
if (innerWidth > 820 && store.get("claude_side", true)) document.body.classList.remove("closed");
renderHello();
if (token) { load(); setInterval(() => { if (!document.hidden && !sending) load(); }, 6000); }
</script>
