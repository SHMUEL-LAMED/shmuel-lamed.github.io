<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ydcfafijktzasrkkxyux.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1f3a5f">
<title>שיחה עם Claude</title>
<style>
:root{--bg:#f3f5f9;--panel:#fff;--ink:#1b2333;--mute:#69728a;--line:#e3e7ef;--brand:#1f3a5f;--acc:#d97757;--mine:#dbe9ff;--theirs:#fff;--chatbg:#e9edf4;--shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0e131c;--panel:#161d2b;--ink:#e7ebf3;--mute:#93a0b8;--line:#263044;--brand:#16263f;--acc:#e08a6c;--mine:#23457a;--theirs:#1d2638;--chatbg:#0b1018;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--chatbg);color:var(--ink);font-size:16px;line-height:1.5;display:flex;flex-direction:column}
button,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px}
header a{color:#fff;text-decoration:none;font-size:22px;padding:0 6px}
header b{font-size:18px}
#stat{font-size:13px;opacity:.85;flex:1}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(680px,85%);padding:8px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.m.me{align-self:flex-start;background:var(--mine)}
.m.claude{align-self:flex-end;background:var(--theirs)}
.t{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.cf{display:block;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:14px}
.empty{color:var(--mute);text-align:center;margin:auto;padding:20px}
form{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:160px;padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);outline:0}
textarea:focus{border-color:var(--acc)}
#send{border:0;border-radius:50%;width:42px;height:42px;background:var(--acc);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
#send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
</style>
</head>
<body>
<header><a href="./" aria-label="חזרה לצ'אטים">&#8250;</a><b>Claude</b><span id="stat"></span></header>
<div id="msgs"><div class="empty">טוען...</div></div>
<form id="f">
  <textarea id="text" rows="1" placeholder="כתוב ל-Claude..." aria-label="הודעה ל-Claude"></textarea>
  <button id="send" type="submit" aria-label="שליחה"><svg viewBox="0 0 24 24"><path d="M21 12 4 4l3 8-3 8zM7 12h7"/></svg></button>
</form>
<script>
"use strict";
// השיחה עם Claude: דרך הגשר ב-Supabase (נטפרי חוסם workers.dev), עם אותה כניסה של אתר הצאט
const API = "https://ydcfafijktzasrkkxyux.supabase.co/functions/v1/chat-netfree/";
const $ = (id) => document.getElementById(id);
let token = "";
try { token = localStorage.getItem("chat_token") || ""; } catch (e) {}
if (!token) location.replace("./");
let sig = "", first = true, sending = false;
function el(tag, cls, text) { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
async function api(op, body) {
  let r;
  try {
    r = await fetch(API + op + "?token=" + encodeURIComponent(token), {
      method: body ? "POST" : "GET",
      headers: body ? { "content-type": "text/plain;charset=UTF-8" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw new Error("אין חיבור לשרת"); }
  const j = await r.json().catch(() => ({ error: "תקלה בחיבור" }));
  if (r.status === 401) { try { localStorage.removeItem("chat_token"); } catch (e) {} location.replace("./"); }
  if (!r.ok || j.error) throw new Error(j.error || "תקלה");
  return j;
}
function when(ms) { const d = new Date(ms); return d.toLocaleDateString("he-IL", { day: "numeric", month: "numeric" }) + " " + d.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }); }
async function load() {
  let j;
  try { j = await api("claude_history"); } catch (e) { $("stat").textContent = e.message; return; }
  const items = j.items || [];
  const waiting = items.length && items[items.length - 1].from === "me";
  $("stat").textContent = j.live ? "מחובר עכשיו" : waiting ? "ההודעה ממתינה – התשובה תגיע כש-Claude יתחבר" : "";
  const s = JSON.stringify(items.map((m) => [m.id, m.status]));
  if (s === sig) return;
  sig = s;
  const box = $("msgs"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.textContent = "";
  if (!items.length) box.appendChild(el("div", "empty", "אפשר לכתוב כאן ל-Claude. התשובה תופיע כאן."));
  for (const m of items) {
    const d = el("div", "m " + (m.from === "me" ? "me" : "claude"), m.text);
    if (m.confirm) d.appendChild(el("span", "cf", "ממתין לאישור: " + m.confirm + " (אפשר לכתוב כאן 'מאשר' או 'לבטל')"));
    d.appendChild(el("span", "t", when(m.at) + (m.from === "me" && m.status === "new" ? " · נשלח" : "")));
    box.appendChild(d);
  }
  if (atEnd || first) box.scrollTop = box.scrollHeight;
  first = false;
}
$("text").addEventListener("input", (e) => { const t = e.target; t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; });
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); } });
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const t = $("text"), text = t.value.trim();
  if (!text || sending) return;
  sending = true;
  try { await api("claude_send", { text }); t.value = ""; t.style.height = "auto"; first = true; await load(); }
  catch (err) { $("stat").textContent = err.message; }
  finally { sending = false; }
};
if (token) { load(); setInterval(() => { if (!document.hidden) load(); }, 6000); }
</script>
</body>
</html>
