<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ydcfafijktzasrkkxyux.supabase.co; img-src data: blob:; media-src blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#f6f8fc">
<title>צ'אט</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b57d0'/%3E%3Cpath d='M24 26h52v36H46L32 76V62h-8z' fill='%23fff'/%3E%3C/svg%3E">
<script>try{var t=(JSON.parse(localStorage.getItem("chat_prefs")||"{}")||{}).theme;document.documentElement.dataset.theme=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"}catch(e){}</script>
<style>
:root{
  --bg:#f6f8fc;--panel:#fff;--ink:#1f1f1f;--mute:#5f6368;--line:#e1e3e1;--hover:rgba(31,31,31,.06);--rowh:#f6f8fc;
  --sel:#d3e3fd;--selink:#041e49;--acc:#0b57d0;--accink:#fff;--link:#0b57d0;--fab:#c2e7ff;--fabink:#001d35;
  --field:#e9eef6;--soft:#f0f4f9;--bad:#b3261e;--mark:#fde293;--tome:#fef7e0;--mine:#d3e3fd;--mineink:#041e49;
  --pop:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);--fs:14px;color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#1b1c1d;--panel:#131314;--ink:#e3e3e3;--mute:#a8abaf;--line:#3c4043;--hover:rgba(227,227,227,.08);--rowh:#1e1f21;
  --sel:#004a77;--selink:#c2e7ff;--acc:#a8c7fa;--accink:#062e6f;--link:#a8c7fa;--fab:#004a77;--fabink:#c2e7ff;
  --field:#28292b;--soft:#232427;--bad:#f2b8b5;--mark:#5c4b00;--tome:#2b2819;--mine:#004a77;--mineink:#e3f2ff;
  --pop:0 4px 16px rgba(0,0,0,.7);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Google Sans",Roboto,"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hide{display:none!important}
.grow{flex:1;min-width:0}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mute);transition:background .15s}
.ib:hover{background:var(--hover)}
.ib.on{color:var(--acc);background:var(--sel)}
.ib.sm{width:32px;height:32px}
.ib.sm svg{width:18px;height:18px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:500;font-size:17px;flex:none;user-select:none}
.av.sq{border-radius:30%}
.av.s24{width:24px;height:24px;font-size:12px}
.av.s32{width:32px;height:32px;font-size:14px}
.av.s72{width:72px;height:72px;font-size:30px}
.btn{background:var(--acc);color:var(--accink);padding:10px 24px;border-radius:20px;font-weight:500;transition:box-shadow .15s}
.btn:hover{box-shadow:var(--pop)}
.chip{padding:5px 14px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink)}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--sel);border-color:transparent;color:var(--selink)}
.empty{margin:auto;color:var(--mute);text-align:center;padding:28px 16px}
.empty svg{width:56px;height:56px;stroke-width:1.2;opacity:.45;display:block;margin:0 auto 10px}

/* כניסה */
#login{min-height:100%;display:grid;place-items:center;padding:20px}
#login .card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:36px 32px;text-align:center}
#login .logo{width:56px;height:56px;border-radius:16px;background:var(--acc);color:var(--accink);display:grid;place-items:center;margin:0 auto 16px}
#login .logo svg{width:30px;height:30px}
#login h2{margin:0;font-size:24px;font-weight:400}
#login p{margin:6px 0 0;color:var(--mute)}
#login input{width:100%;padding:14px;border:1px solid var(--mute);border-radius:6px;background:none;text-align:center;font-size:22px;letter-spacing:6px;margin:24px 0 16px;outline:0}
#login input:focus{border:2px solid var(--acc);padding:13px}
.err{color:var(--bad);min-height:1.5em;margin-top:10px;font-size:14px}

/* מבנה */
#app{display:grid;grid-template-columns:256px minmax(0,1fr) auto;grid-template-rows:64px minmax(0,1fr);height:100%}
body.navx #app{grid-template-columns:0 minmax(0,1fr) auto}
body.navx #nav{display:none}
body.navx #main{margin-inline-start:16px}
#top{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:8px 8px 8px 12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;width:206px;flex:none;font-size:22px;padding-inline-start:4px;color:var(--ink)}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--accink);display:grid;place-items:center}
.brand i svg{width:19px;height:19px;stroke-width:2.2}
#sbox{flex:1;max-width:720px;height:48px;border-radius:24px;background:var(--field);display:flex;align-items:center;padding:0 4px;gap:2px;min-width:0;transition:background .15s,box-shadow .15s}
#sbox:focus-within{background:var(--panel);box-shadow:var(--pop)}
#sbox input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;padding:0 4px}
#sbox input::-webkit-search-cancel-button{display:none}
#offline{background:var(--bad);color:var(--panel);border-radius:12px;padding:3px 10px;font-size:12px;margin:0 8px;white-space:nowrap}
#nav{overflow-y:auto;padding:4px 0 16px;min-height:0}
#newbtn{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 24px;margin:4px 8px 12px;border-radius:16px;background:var(--fab);color:var(--fabink);font-weight:500;font-size:14px;transition:box-shadow .15s}
#newbtn:hover{box-shadow:var(--pop)}
#newbtn svg{width:22px;height:22px}
.ni{display:flex;align-items:center;gap:12px;width:calc(100% - 8px);height:32px;padding:0 16px 0 12px;border-radius:0 16px 16px 0;text-align:start;color:var(--ink);text-decoration:none;font-size:14px;position:relative}
[dir=rtl] .ni{border-radius:16px 0 0 16px}
.ni:hover{background:var(--hover)}
.ni.on{background:var(--sel);color:var(--selink);font-weight:700}
.ni svg{width:18px;height:18px;color:var(--mute)}
.ni.on svg{color:inherit}
.ni .t{flex:1;min-width:0;display:flex;flex-direction:column}
.ni .nm,.ni .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .d,.ni .tm{display:none}
.ni.un{font-weight:700}
.ni.muted .nm{opacity:.6}
.ni .ic{width:14px;height:14px}
.ud{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.cnt{font-size:12px;font-weight:700;margin-inline-start:auto}
.spw{position:relative}
.spw>.more{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);opacity:0;background:var(--panel)}
.spw:hover>.more,.spw>.more:focus-visible{opacity:1}
.navs{margin-bottom:8px}
.filt{display:flex;gap:6px;padding:4px 16px 4px;flex-wrap:wrap}
.sec{display:flex;align-items:center;margin-top:10px;padding-inline-end:8px}
.sh{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;font-weight:500;font-size:14px;color:var(--ink);border-radius:16px 0 0 16px;text-align:start}
.sh:hover{background:var(--hover)}
.sh svg{width:18px;height:18px;transition:transform .15s}
.sh.x svg{transform:rotate(90deg)}
.nempty{color:var(--mute);font-size:13px;padding:2px 50px 4px 12px}
#main{grid-column:2;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:16px;margin:0 0 16px 16px;overflow:hidden;position:relative}
body.side #main{margin-inline-end:0}
#side{grid-column:3;width:min(420px,34vw);min-height:0;display:flex;flex-direction:column;background:var(--panel);border-radius:16px;margin:0 8px 16px 16px;overflow:hidden}
.vh{display:flex;align-items:center;gap:6px;min-height:64px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line);flex:none}
.vh h2{margin:0;font-size:20px;font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh .who{flex:1;min-width:0;margin-inline-start:4px}
.vh .who b{display:block;font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh .who small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:none}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.chips{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto;flex:none;align-items:center}
.list{flex:1;overflow-y:auto;padding:4px 0 24px}
.hr{display:flex;align-items:center;gap:14px;width:100%;padding:10px 20px;text-align:start;border-bottom:1px solid var(--line)}
.hr:hover{background:var(--rowh);box-shadow:inset 0 -1px 0 var(--line),0 1px 3px rgba(60,64,67,.12)}
.hr .t{flex:1;min-width:0}
.hr .n{display:flex;gap:8px;align-items:baseline}
.hr .n span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.hr .n small{flex:none;font-size:12px;color:var(--mute)}
.hr .d{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr .d em{color:var(--bad);font-style:normal}
.hr.un .n span,.hr.un .n small{font-weight:700;color:var(--ink)}
.hr.un .d{color:var(--ink);font-weight:500}
.lh{font-size:12px;font-weight:500;color:var(--mute);padding:16px 20px 6px;letter-spacing:.2px}
.card{display:block;width:calc(100% - 32px);margin:8px 16px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;text-align:start;position:relative}
.card:hover{box-shadow:var(--pop);border-color:transparent}
.card .ch{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card .ch b{font-weight:500}
.card .ch small{color:var(--mute);font-size:12px;display:block}
.card .ct{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .x{position:absolute;top:8px;inset-inline-end:8px}
mark{background:var(--mark);color:inherit;border-radius:3px}

/* שיחה */
.msgs{flex:1;overflow-y:auto;padding:8px 0 16px;display:flex;flex-direction:column;overscroll-behavior:contain}
.row{display:flex;gap:12px;padding:6px 20px 2px;position:relative;scroll-margin:60px}
.row.cont{padding-top:1px}
.row:hover,.row.sel{background:var(--rowh)}
.row.tome{background:var(--tome)}
.row.flash{animation:flash 1.6s}
@keyframes flash{0%,50%{background:var(--sel)}100%{background:transparent}}
.gut{width:32px;flex:none;font-size:10.5px;color:var(--mute);text-align:center;padding-top:4px;visibility:hidden;white-space:nowrap}
.row.cont:hover .gut{visibility:visible}
.mb{flex:1;min-width:0}
.hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hd b{font-size:14px;font-weight:500}
.hd time,.hd small{font-size:12px;color:var(--mute)}
.st{width:13px;height:13px;color:#e8a600;fill:#e8a600;align-self:center}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--fs)}
.mt .ed{font-size:11px;color:var(--mute)}
.men{color:var(--link);font-weight:500;background:var(--sel);border-radius:4px;padding:0 3px}
.mt code{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:ui-monospace,Consolas,monospace;font-size:.92em;direction:ltr;unicode-bidi:embed}
.mt pre{margin:4px 0;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;direction:ltr;text-align:left;white-space:pre-wrap}
.mt a{color:var(--link)}
.q{display:block;max-width:100%;text-align:start;border-inline-start:3px solid var(--mute);padding:2px 10px;margin:2px 0 4px;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q b{display:block;color:var(--ink);font-size:12px;font-weight:500}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx button{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:0 8px;font-size:13px;line-height:24px;height:26px}
.rx button:hover{border-color:var(--acc)}
.rx .add{color:var(--mute);display:grid;place-items:center;opacity:0}
.rx .add svg{width:16px;height:16px}
.row:hover .rx .add,.row.sel .rx .add{opacity:1}
.file{display:flex;align-items:center;gap:10px;margin-top:6px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);font-size:13px;text-align:start;max-width:340px;width:100%;color:inherit;text-decoration:none}
.file:hover{background:var(--hover)}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file svg{color:var(--acc)}
.pic{margin-top:6px;border-radius:8px;overflow:hidden;min-width:140px;min-height:90px;max-width:360px;background:var(--soft);color:var(--mute);font-size:13px;display:grid;place-items:center}
.pic img{display:block;max-width:100%;max-height:300px}
.mb audio,.mb video{display:block;margin-top:6px;max-width:100%;border-radius:8px}
.mb video{max-height:300px}
.rep{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--link);font-weight:500;padding:2px 8px;margin-inline-start:-8px;border-radius:12px}
.rep:hover{background:var(--sel)}
.rep svg{width:16px;height:16px}
.tb{position:absolute;top:-18px;inset-inline-end:20px;display:none;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:2px;z-index:2}
.tb button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mute);font-size:17px}
.tb button:hover{background:var(--hover)}
.tb button.on{color:#e8a600}
.tb button.on svg{fill:#e8a600}
.tb svg{width:18px;height:18px}
.row:hover .tb,.row.sel .tb{display:flex}
.row:first-child .tb{top:2px}
@media (hover:none){.row:hover .tb{display:none}.row.sel .tb{display:flex}.row:hover:not(.sel):not(.tome){background:none}}
/* ההודעות שלי: בצד שמאל, בבועה תכלת מעוגלת, כמו בגוגל צ'אט */
.row.mine{flex-direction:row-reverse}
.row.mine>.av,.row.mine>.gut{display:none}
.row.mine:hover,.row.mine.sel{background:none}
.row.mine .mb{flex:0 1 auto;max-width:min(78%,600px);background:var(--mine);color:var(--mineink);border-radius:18px 18px 18px 4px;padding:6px 14px 8px}
.row.mine .hd{justify-content:flex-end}
.row.mine .hd b{display:none}
.row.mine .hd time,.row.mine .hd small,.row.mine .stt,.row.mine .mt .ed{color:inherit;opacity:.72}
.row.mine .q{border-color:currentColor;color:inherit;opacity:.85}
.row.mine .q b{color:inherit}
.row.mine .mt a,.row.mine .rep{color:inherit;text-decoration:underline}
.row.mine .file{border-color:rgba(127,127,127,.4)}
.row.mine .file svg{color:inherit}
.row.mine .tb{inset-inline-end:auto;inset-inline-start:20px}
.pend .mb{opacity:.6}
.fail .mb{opacity:1}
.stt{font-size:12px;color:var(--mute)}
.fail .stt{color:var(--bad)}
.stt button{color:var(--link);text-decoration:underline;margin-inline-start:8px;font-size:12px}
.day,.newline{display:flex;align-items:center;gap:14px;margin:16px 20px 6px;color:var(--mute);font-size:12px;font-weight:500}
.day::before,.day::after,.newline::before,.newline::after{content:"";flex:1;height:1px;background:var(--line)}
.newline{color:var(--bad)}
.newline::before,.newline::after{background:var(--bad);opacity:.5}
.older{align-self:center;margin:8px}
#down{position:absolute;inset-inline-start:50%;transform:translateX(50%);bottom:110px;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:18px;background:var(--panel);color:var(--acc);box-shadow:var(--pop);font-weight:500;font-size:13px;z-index:3}
#down svg{width:16px;height:16px}
#down.new{background:var(--acc);color:var(--accink)}
.bar{display:flex;align-items:center;gap:8px;padding:6px 20px;font-size:13px;color:var(--mute)}
.bar b{color:var(--ink);font-weight:500}
.bar .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#findbar{border-bottom:1px solid var(--line)}
#findbar input{flex:1;min-width:0;border:0;border-radius:18px;background:var(--field);padding:7px 14px;outline:0}
#summary{margin:10px 20px 0;padding:12px 16px;background:var(--soft);border-radius:12px;font-size:14px;max-height:40%;overflow-y:auto;flex:none}
#summary .sh2{display:flex;align-items:center;font-weight:500;margin-bottom:4px}
#summary .sh2 span{flex:1}
#sumtext{white-space:pre-wrap}
.cwrap{flex:none;padding:0 16px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.compose{display:flex;flex-wrap:wrap;align-items:flex-end;background:var(--soft);border-radius:24px;padding:4px 6px;border:1px solid transparent;transition:border-color .15s}
.compose:focus-within{border-color:var(--line);background:var(--panel);box-shadow:var(--pop)}
.compose textarea{flex:1 1 280px;min-width:0;resize:none;border:0;background:none;padding:9px 12px;max-height:180px;outline:0;font-size:var(--fs);line-height:1.45}
.tools{display:flex;align-items:center;gap:0;margin-inline-start:auto}
.tools .ib{width:36px;height:36px}
.tools .send{color:var(--acc)}
.tools .send svg{transform:scaleX(-1)}
.tools .send:disabled{color:var(--mute)}
.cc{font-size:11px;color:var(--mute);padding:0 6px}
.cc.bad{color:var(--bad)}
.mic.rec{background:var(--bad);color:#fff;width:auto;padding:0 12px;gap:6px;border-radius:18px;display:flex;font-size:13px}
.fmtbar{flex-basis:100%;display:flex;gap:2px;padding:2px 6px;border-bottom:1px solid var(--line)}
.fmtbar button{min-width:32px;height:30px;border-radius:6px;font-size:15px;color:var(--mute)}
.fmtbar button:hover{background:var(--hover)}
.filebar{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;max-width:100%;font-size:13px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center}
.fchip button svg{width:14px;height:14px}
.cwrap .bar{padding:4px 8px}
.pane{position:relative}
.pane.drag::after{content:"שחררו כדי לצרף";position:absolute;inset:8px;border:2px dashed var(--acc);border-radius:16px;background:rgba(11,87,208,.08);display:grid;place-items:center;font-weight:500;font-size:18px;pointer-events:none;z-index:5}
#sugg{position:fixed;z-index:30;background:var(--panel);border-radius:12px;box-shadow:var(--pop);padding:6px 0;width:280px;max-height:260px;overflow-y:auto}
#sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 14px;text-align:start}
#sugg button.on,#sugg button:hover{background:var(--hover)}
#emo{position:fixed;z-index:35;background:var(--panel);border-radius:12px;box-shadow:var(--pop);padding:8px;width:320px;max-width:calc(100vw - 16px);max-height:300px;overflow-y:auto}
#emo .g{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
#emo .l{font-size:12px;color:var(--mute);padding:4px 4px 2px}
#emo button{height:36px;border-radius:8px;font-size:21px}
#emo button:hover{background:var(--hover)}

/* חלון צד: שרשור ופרטים */
#side .msgs{padding-top:12px}
#side .row{padding-inline:16px}
#side .tb{inset-inline-end:12px}
#infob{flex:1;overflow-y:auto;padding-bottom:20px}

  tog("התראות בשולחן העבודה על הודעות חדשות", setBell(), async () => { await toggleBell(); settings(); });
  tog("צליל כשמגיעה הודעה חדשה", prefs.sound, () => { setPref("sound", !prefs.sound); ping(); settings(); });
  nodes.push(el("div", "sect", ""));
  const row = (ic, label, fn, cls) => { const b = el("button", "rowbtn" + (cls ? " " + cls : "")); b.type = "button"; b.append(icon(ic), el("span", "t", label)); b.onclick = fn; nodes.push(b); };
  row("help", "קיצורי מקלדת", help);
  row("refresh", "רענון", () => { closeSheet(); $("refresh").click(); });
  row("out", "יציאה מהחשבון באתר", () => { closeSheet(); logout(false); }, "danger");
  openSheet("הגדרות", nodes);
}
$("setbtn").onclick = settings;
function help() {
  const t = el("table", "keys");
  const K = [["חיפוש", "/", "Ctrl+K"], ["צ'אט חדש", "N"], ["מסך הבית", "H"], ["אזכורים", "M"], ["מסומנים בכוכב", "S"], ["שיחה קודמת / הבאה", "Alt+↑", "Alt+↓"], ["שיחה שלא נקראה, הבאה", "Alt+Shift+↓"], ["כתיבת הודעה", "R"], ["חיפוש בשיחה", "F"], ["פרטי השיחה", "I"], ["קפיצה להודעות האחרונות", "J"], ["סימון הכל כנקרא", "Shift+Esc"], ["שליחה / שורה חדשה", "Enter", "Shift+Enter"], ["מודגש, נטוי, קו חוצה", "Ctrl+B", "Ctrl+I", "Ctrl+Shift+X"], ["עריכת ההודעה האחרונה שלי", "↑"], ["סגירה / ביטול", "Esc"], ["העזרה הזו", "?"]];
  for (const [label, ...keys] of K) { const r = el("tr"), a = el("td", "", label), b = el("td"); keys.forEach((k, i) => { if (i) b.append(" "); b.append(el("kbd", "", k)); }); r.append(a, b); t.append(r); }
  openSheet("קיצורי מקלדת", [t]);
}
$("helpbtn").onclick = help;

// ---- תצוגת תמונה
let viewing = null;
function openViewer(a, url) { viewing = a; $("vimg").src = url; $("vimg").alt = a.name; $("viewer").classList.remove("hide"); }
const closeViewer = () => { $("viewer").classList.add("hide"); $("vimg").removeAttribute("src"); viewing = null; };
$("vx").onclick = closeViewer;
$("vdl").onclick = () => { if (viewing) download(viewing); };
$("viewer").onclick = (e) => { if (e.target === $("viewer") || e.target === $("viewer").firstElementChild) closeViewer(); };

// ---- מקלדת
const navOrder = () => navList().filter(([id]) => !st.coll[id]).flatMap(([, , l]) => l);
function stepChat(d, unread) {
  const L = navOrder(); if (!L.length) return;
  let i = st.cur ? L.findIndex((s) => s.space === st.cur.space) : -1;
  for (let n = 0; n < L.length; n++) { i = (i + d + L.length) % L.length; if (!unread || unreadOf(L[i])) return openSpace(L[i]); }
  if (unread) toast("אין שיחות שלא נקראו");
}
document.addEventListener("keydown", (e) => {
  if (!st.token || $("app").classList.contains("hide")) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (e.key === "Escape") {
    if (e.shiftKey && !typing) return markAllRead();
    if (!$("viewer").classList.contains("hide")) return closeViewer();
    if (!$("emo").classList.contains("hide")) return closeEmo();
    if (!$("menu").classList.contains("hide")) return closeMenu();
    if (!$("sheet").classList.contains("hide")) return closeSheet();
    if (!$("newdm").classList.contains("hide")) return closeNew();
    if (!$("findbar").classList.contains("hide")) { closeFind(); M.toBottom = true; return paint(M); }
    if (st.side) return sideBack();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.code === "KeyK") { e.preventDefault(); return focusSearch(); }
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); return stepChat(e.key === "ArrowDown" ? 1 : -1, e.shiftKey); }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !$("sheet").classList.contains("hide") || !$("newdm").classList.contains("hide")) return;
  const k = e.code === "Slash" ? (e.shiftKey ? "?" : "/") : e.key === "/" || e.key === "?" ? e.key : e.code;
  const map = { "/": focusSearch, "?": help, KeyN: () => openNew(false), KeyH: () => go("home"), KeyM: () => go("mentions"), KeyS: () => go("starred"), KeyR: () => st.cur && M.text.focus(), KeyF: toggleFind, KeyI: showInfo, KeyJ: toLatest };
  if (map[k]) { e.preventDefault(); map[k](); }
});
document.addEventListener("visibilitychange", () => { if (visible() && st.token) { loadSpaces(); if (st.cur) loadMsgs(M); } });
const online = () => $("offline").classList.toggle("hide", navigator.onLine);
addEventListener("online", () => { online(); if (st.token) loadSpaces(); });
addEventListener("offline", online);
// קישור ישיר: #spaces/... פותח את השיחה, ו-#spaces/.../messages/... גם קופץ להודעה
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1)), m = /^(spaces\/[\w-]+)(?:\/messages\/[\w.-]+)?$/.exec(h);
  if (!m) return;
  history.replaceState(history.state, "", location.pathname + location.search);
  const s = spaceOf(m[1]) || { space: m[1], title: "צ'אט", dm: false, last: "" };
  openSpace(s, h.includes("/messages/") ? { jump: h } : {});
}
addEventListener("hashchange", () => { if (st.token) fromHash(); });

M = mkPane("main", $("conv"), $("mmsgs"));
T = mkPane("th", $("thpane"), $("tmsgs"));
act = M;
function start() {
  show("app"); setBell(); online();
  if (!st.cur) closeConv(true);
  renderNav(); renderView();
  loadSpaces();
  st.timers.forEach(clearInterval);
  // שיחה פתוחה נבדקת כל כמה שניות; רשימת השיחות פחות
  st.timers = [
    setInterval(() => { if (visible() && st.cur) { loadMsgs(M); if (T.space) loadMsgs(T); } }, 7000),
    setInterval(() => { if (visible() || st.notif || prefs.sound) loadSpaces(); }, 25000),
  ];
}
if (st.token) start(); else show("login");
</script>
</body>
</html>
