<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ydcfafijktzasrkkxyux.supabase.co; img-src data: blob:; media-src blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1f3a5f">
<title>הצ'אטים שלי</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f3a5f'/%3E%3Cpath d='M22 30h56v32H44l-14 12V62h-8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f9;--panel:#fff;--ink:#1b2333;--mute:#69728a;--line:#e3e7ef;--hover:#eef2f8;
  --brand:#1f3a5f;--brand2:#2c5282;--acc:#d97757;--acc-ink:#fff;--link:#1f5fae;
  --mine:#dbe9ff;--theirs:#fff;--chatbg:#e9edf4;--bad:#c33131;--mark:#ffe58a;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);
  --pop:0 8px 30px rgba(15,25,45,.22);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e131c;--panel:#161d2b;--ink:#e7ebf3;--mute:#93a0b8;--line:#263044;--hover:#1e2738;
  --brand:#16263f;--brand2:#1f3a5f;--acc:#e08a6c;--link:#8fb8f0;
  --mine:#23457a;--theirs:#1d2638;--chatbg:#0b1018;--bad:#ff7b7b;--mark:#7a6410;
  --shadow:0 1px 2px rgba(0,0,0,.4);--pop:0 8px 30px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:hover{background:var(--hover)}
.ib.on{color:var(--acc)}

/* כניסה */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--brand),var(--brand2))}
#login .card{width:100%;max-width:360px;background:var(--panel);border-radius:20px;padding:30px 26px;text-align:center;box-shadow:var(--pop)}
#login .logo{width:64px;height:64px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
#login .logo svg{width:34px;height:34px}
#login h2{margin:0;font-size:22px}
#login p{margin:4px 0 0;color:var(--mute)}
#login input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);text-align:center;font-size:22px;letter-spacing:6px;margin:18px 0 12px}
.btn{background:var(--acc);color:var(--acc-ink);padding:12px 18px;border-radius:12px;font-weight:700;width:100%;transition:filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);min-height:1.5em;margin-top:10px;font-size:14px}

/* מבנה */
#app{display:flex;height:100%}
#list{width:360px;flex:none;border-inline-end:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#top{background:var(--brand);color:#fff;padding:10px 12px 10px 8px;display:flex;align-items:center;gap:2px;min-height:58px}
#top h1{font-size:19px;margin:0 6px 0 0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .ib:hover{background:rgba(255,255,255,.14)}
#top .ib.on{color:#ffd0bd}
.searchrow{display:flex;gap:8px;padding:12px 12px 8px}
.field{flex:1;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:22px;background:var(--bg);border:1.5px solid transparent;color:var(--mute);min-width:0}
.field:focus-within{border-color:var(--acc)}
.field input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:0;color:var(--ink)}
#newbtn{background:var(--acc);color:#fff}
#newbtn:hover{background:var(--acc);filter:brightness(1.06)}
.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
.tabs button{padding:5px 13px;border-radius:20px;background:var(--bg);font-size:14px;white-space:nowrap;color:var(--mute);transition:background .15s}
.tabs button.on{background:var(--brand2);color:#fff}
.tabs b{font-weight:600;margin-inline-start:4px}
#spaces{overflow-y:auto;flex:1;padding:0 6px 8px}
.sp{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;width:100%;text-align:start;transition:background .12s}
.sp:hover{background:var(--hover)}
.sp.on{background:var(--mine)}
.av{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.av.sm{width:38px;height:38px;font-size:16px}
.spw{position:relative}
.spw>.more{position:absolute;inset-inline-end:8px;top:50%;margin-top:-17px;width:34px;height:34px;background:var(--panel);box-shadow:var(--shadow);opacity:0}
.spw:hover>.more,.spw>.more:focus-visible{opacity:1}
.sp .t{flex:1;min-width:0}
.sp .n{display:flex;gap:8px;align-items:baseline}
.sp .n span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .n small{flex:none;font-size:12px;color:var(--mute);font-weight:400}
.sp .d{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp.un .n{font-weight:700}
.sp.un .d{color:var(--ink);font-weight:600}
.sp.un .n small{color:var(--acc);font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;background:var(--acc);flex:none}
.sp.muted .n,.sp.muted .av{opacity:.55}

/* שיחה */
#conv{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chatbg);position:relative}
#convhead{display:flex;align-items:center;gap:4px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:58px}
#convhead .who{flex:1;min-width:0;margin-inline-start:8px}
#ctitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#csub{font-size:13px;color:var(--mute)}
#back{display:none}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{padding:4px 12px;border-radius:16px;background:var(--bg);font-size:14px}
.chip:hover{background:var(--hover)}
#summary{margin:10px 14px 0;padding:12px 14px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);border-inline-start:4px solid var(--acc);font-size:15px;max-height:40%;overflow-y:auto}
#summary .sh{display:flex;align-items:center;font-weight:700;margin-bottom:4px}
#summary .sh span{flex:1}
#sumtext{white-space:pre-wrap}
#msgs{flex:1;overflow-y:auto;padding:14px max(14px,calc((100% - 860px)/2));display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:4px;max-width:82%;align-self:flex-start;margin-top:8px}
.row.cont{margin-top:1px}
.row.mine{align-self:flex-end;flex-direction:row-reverse}
.m{padding:7px 12px 5px;border-radius:16px;background:var(--theirs);box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;min-width:64px;border-start-start-radius:5px}
.row.mine .m{background:var(--mine);border-start-start-radius:16px;border-start-end-radius:5px}
.row.cont .m{border-start-start-radius:16px;border-start-end-radius:16px}
.m .w{font-size:13px;font-weight:700}
.m.tome{box-shadow:var(--shadow),inset 3px 0 0 var(--acc)}
.m.flash{animation:flash 1.2s}
@keyframes flash{0%,60%{outline:2.5px solid var(--acc)}100%{outline:2.5px solid transparent}}
.m .men{color:var(--link);font-weight:600;background:rgba(31,95,174,.1);border-radius:5px;padding:0 3px}
.m code{background:rgba(127,140,165,.2);border-radius:5px;padding:1px 5px;font-family:ui-monospace,Consolas,monospace;font-size:14px;direction:ltr;unicode-bidi:embed}
.m pre{margin:4px 0;background:rgba(127,140,165,.2);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;direction:ltr;text-align:left;white-space:pre-wrap}
.q{display:block;width:100%;text-align:start;border-inline-start:3px solid var(--acc);background:rgba(127,140,165,.14);border-radius:6px;padding:4px 9px;margin-bottom:5px;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q b{display:block;color:var(--ink);font-size:12px}
.m .at{font-size:11px;color:var(--mute);text-align:end;margin-top:1px;white-space:nowrap}
.m a{color:var(--link)}
.m mark{background:var(--mark);color:inherit;border-radius:3px}
.row .more{width:30px;height:30px;opacity:0;color:var(--mute)}
.row:hover .more,.row .more:focus-visible{opacity:1}
@media (hover:none){.row .more{opacity:.7}}
.row.pend .m{opacity:.65}
.row.fail .m{opacity:1;outline:1.5px solid var(--bad)}
.fail .at{color:var(--bad);white-space:normal}
.fail .at button{color:var(--link);text-decoration:underline;margin-inline-start:8px;font-size:12px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.reacts button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 8px;font-size:13px;line-height:22px}
.reacts button:hover{border-color:var(--acc)}
.file{display:flex;align-items:center;gap:8px;margin-top:4px;padding:7px 10px;border-radius:10px;background:rgba(127,140,165,.14);font-size:14px;text-align:start;width:100%;color:inherit;text-decoration:none}
.file:hover{background:rgba(127,140,165,.24)}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic{margin-top:4px;border-radius:10px;overflow:hidden;min-width:140px;min-height:90px;background:rgba(127,140,165,.14);color:var(--mute);font-size:13px;display:grid;place-items:center}
.pic img{display:block;max-width:100%;max-height:300px}
.m audio,.m video{display:block;margin-top:4px;max-width:100%;border-radius:10px}
.m video{max-height:300px}
.rep{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:13px;color:var(--link);font-weight:600}
.rep svg{width:15px;height:15px}
.day,.newline{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);padding:2px 12px;border-radius:12px;margin:10px 0 2px;box-shadow:var(--shadow)}
.newline{align-self:stretch;text-align:center;background:none;box-shadow:none;color:var(--acc);font-weight:700;display:flex;align-items:center;gap:10px;padding:0}
.newline::before,.newline::after{content:"";flex:1;height:1.5px;background:var(--acc);opacity:.5}
.older{align-self:center;margin-bottom:6px}
.older.chip{background:var(--panel);box-shadow:var(--shadow)}
.empty{margin:auto;color:var(--mute);text-align:center;padding:24px}
.empty svg{width:54px;height:54px;stroke-width:1.3;opacity:.5;display:block;margin:0 auto 8px}
#down{position:absolute;inset-inline-end:18px;bottom:86px;width:42px;height:42px;border-radius:50%;background:var(--panel);box-shadow:var(--pop);display:grid;place-items:center}
#down.new::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:11px;height:11px;border-radius:50%;background:var(--acc)}
#compose{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
#compose textarea{flex:1;resize:none;border:1.5px solid transparent;border-radius:20px;padding:8px 14px;background:var(--bg);max-height:140px;outline:0}
#compose textarea:focus{border-color:var(--acc)}
#sendbtn{background:var(--acc);color:#fff;width:40px;height:40px}
#sendbtn:hover{background:var(--acc);filter:brightness(1.06)}
#sendbtn svg{transform:scaleX(-1)}
#mic.rec{background:var(--bad);color:#fff;width:auto;padding:0 12px;gap:6px;border-radius:20px;display:flex;font-size:14px}
#sugg{position:absolute;bottom:64px;inset-inline:12px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:5px;z-index:20;max-height:260px;overflow-y:auto}
#sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:9px;text-align:start}
#sugg button.on,#sugg button:hover{background:var(--hover)}
#sugg .av{width:30px;height:30px;font-size:14px}
#filebar{flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:14px;padding:3px 6px 3px 10px;max-width:100%}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:22px;height:22px;border-radius:50%;flex:none}
.fchip button:hover{background:var(--hover)}
#emo{position:fixed;z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:8px;width:300px;max-width:calc(100vw - 16px);display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:250px;overflow-y:auto}
#emo button{height:34px;border-radius:8px;font-size:20px}
#emo button:hover{background:var(--hover)}
.seg{display:flex;gap:6px;padding:4px 14px 0}
.seg button{flex:1;padding:6px;border-radius:10px;background:var(--bg);font-size:14px;color:var(--mute)}
.seg button.on{background:var(--brand2);color:#fff}
.picked{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px}
.sect{font-size:13px;color:var(--mute);font-weight:700;padding:12px 16px 4px}
.modal .in{margin:8px 14px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:0}
.modal .in:focus{border-color:var(--acc)}
.modal .btn{width:auto;margin:6px 14px 12px;flex:none}
.modal .rowbtn{display:flex;align-items:center;gap:10px;width:calc(100% - 12px);margin:0 6px;padding:9px 10px;border-radius:12px;text-align:start}
.modal .rowbtn:hover{background:var(--hover)}
.modal .rowbtn.danger{color:var(--bad)}
.modal .scroll{overflow-y:auto;padding-bottom:10px}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 16px}
.mrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow small{color:var(--mute)}
.mrow .x{font-size:13px;color:var(--bad);padding:3px 9px;border-radius:12px}
.mrow .x:hover{background:var(--hover)}
#conv.drag::after{content:"שחרר כדי לצרף את הקובץ";position:absolute;inset:8px;border:2.5px dashed var(--acc);border-radius:16px;background:rgba(217,119,87,.12);display:grid;place-items:center;font-weight:700;font-size:18px;pointer-events:none}

/* תפריט, חלונות, הודעות קופצות */
#menu{position:fixed;z-index:30;background:var(--panel);border-radius:14px;box-shadow:var(--pop);padding:6px;min-width:190px;border:1px solid var(--line)}
#menu .emo{display:flex;justify-content:space-between;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
#menu .emo button{width:34px;height:34px;border-radius:50%;font-size:19px}
#menu .emo button:hover{background:var(--hover);transform:scale(1.15)}
#menu .it{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:start;font-size:15px}
#menu .it:hover{background:var(--hover)}
#menu .it.danger{color:var(--bad)}
#menu .it svg{width:17px;height:17px}
.over{position:fixed;inset:0;z-index:40;background:rgba(10,16,28,.55);display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:420px;max-height:80vh;background:var(--panel);border-radius:18px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;padding:12px 10px 4px 16px;font-weight:700;font-size:17px}
.modal .mh span{flex:1}
.modal .field{margin:8px 14px;flex:none}
#people{overflow-y:auto;padding:0 6px 10px;min-height:80px;display:flex;flex-direction:column}
#people .sp .d{direction:ltr;text-align:end}
#viewer img{max-width:100%;max-height:calc(100vh - 110px);border-radius:10px;box-shadow:var(--pop);display:block;margin:0 auto}
#viewer .vb{display:flex;gap:10px;justify-content:center;margin-top:12px}
#viewer .vb button{background:var(--panel);padding:8px 16px;border-radius:20px}
#toast{position:fixed;z-index:50;bottom:84px;left:50%;transform:translateX(-50%);background:#222b3b;color:#fff;padding:9px 18px;border-radius:22px;font-size:14px;box-shadow:var(--pop);max-width:90vw;text-align:center}

@media (max-width:760px){
  #list{width:100%;border:0}
  #conv{display:none}
  body.open #list{display:none}
  body.open #conv{display:flex}
  #back{display:grid}
  .row{max-width:92%}
  #convhead{padding-inline-start:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>
    <h2>הצ'אטים שלי</h2>
    <p>כניסה עם הקוד הסודי של הקו</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="קוד סודי">
    <button class="btn" id="go">כניסה</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<div id="app" class="hide">
  <aside id="list">
    <div id="top">
      <h1>הצ'אטים שלי</h1>
      <button class="ib" id="bell" title="התראות על הודעות חדשות" aria-label="התראות על הודעות חדשות"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9zM10 20a2 2 0 0 0 4 0"/></svg></button>
      <button class="ib" id="refresh" title="רענון" aria-label="רענון"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6"/></svg></button>
      <button class="ib" id="logout" title="יציאה" aria-label="יציאה"><svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg></button>
    </div>
    <div class="searchrow">
      <label class="field"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="חיפוש שיחה" aria-label="חיפוש שיחה"></label>
      <button class="ib" id="newbtn" title="שיחה חדשה" aria-label="שיחה חדשה"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="tabs">
      <button data-f="all" class="on">הכל</button>
      <button data-f="unread">לא נקראו<b id="ucount"></b></button>
      <button data-f="dm">פרטיים</button>
      <button data-f="group">קבוצות</button>
    </div>
    <div id="spaces"><div class="empty">טוען...</div></div>
  </aside>

  <section id="conv">
    <div id="convhead" class="hide">
      <button class="ib" id="back" aria-label="חזרה"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <div class="av sm" id="cav"></div>
      <div class="who"><div id="ctitle"></div><div id="csub"></div></div>
      <button class="ib" id="infobtn" title="פרטי השיחה, חברים וקבצים" aria-label="פרטי השיחה, חברים וקבצים"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
      <button class="ib" id="findbtn" title="חיפוש בשיחה" aria-label="חיפוש בשיחה"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ib" id="sum" title="סיכום השיחה" aria-label="סיכום השיחה"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h8"/></svg></button>

async function api(op, body, q) {

}

}

$("go").onclick = async () => {

const initial = (t) => (String(t || "?").trim()[0] || "?");
function hue(t) { let h = 0; for (const c of String(t)) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
const colorOf = (t) => "hsl(" + hue(t) + " 42% 44%)";
const nameColor = (t) => "hsl(" + hue(t) + " 55% " + (matchMedia("(prefers-color-scheme:dark)").matches ? 70 : 36) + "%)";
const fmtTime = (iso) => { if (!iso) return ""; return new Date(iso).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }); };
const fmtDay = (iso) => { if (!iso) return ""; const d = new Date(iso), n = new Date(); if (d.toDateString() === n.toDateString()) return "היום"; const y = new Date(n - 864e5); if (d.toDateString() === y.toDateString()) return "אתמול"; return d.toLocaleDateString("he-IL", { day: "numeric", month: "numeric", year: d.getFullYear() === n.getFullYear() ? undefined : "2-digit" }); };
const fmtWhen = (iso) => { const day = fmtDay(iso); return day === "היום" ? fmtTime(iso) : day; };
const visible = () => document.visibilityState === "visible";
const viewKey = () => (st.cur ? st.cur.space + "|" + st.thread : "");

// ---------------------------------------------------------------- רשימת השיחות
async function loadSpaces() {
  try {
    const list = (await api("spaces")).spaces;
    // שיחה חדשה שעוד לא הופיעה ברשימה של גוגל נשארת מוצגת
    if (st.cur && !list.some((x) => x.space === st.cur.space)) list.unshift(st.cur);
    st.spaces = list;
    if (st.cur) { st.cur = list.find((x) => x.space === st.cur.space) || st.cur; setHead(); }
    const unread = list.filter((s) => s.unread && !s.muted);
    if (st.seen) for (const s of unread) {
      const here = st.cur && st.cur.space === s.space;
      if (s.last > (st.seen[s.space] || "")) { if (here && visible()) loadMsgs(); else notify(s); }
    }
    st.seen = Object.fromEntries(list.map((s) => [s.space, s.unread ? s.last : ""]));
    renderSpaces();
  } catch (e) { if (!st.spaces.length && st.token) $("spaces").replaceChildren(el("div", "empty", e.message)); }
}
function renderSpaces() {
  const q = $("search").value.trim().toLowerCase();
  const unread = st.spaces.filter((s) => s.unread && !s.muted).length;
  document.title = (unread ? "(" + unread + ") " : "") + TITLE;
  $("ucount").textContent = unread ? unread : "";
  const list = st.spaces.filter((s) => (st.filter === "all" || (st.filter === "unread" ? s.unread && !s.muted : st.filter === "dm" ? s.dm : !s.dm)) && (!q || s.title.toLowerCase().includes(q)));
  const box = $("spaces");
  if (!list.length) { box.replaceChildren(el("div", "empty", q ? "לא נמצאה שיחה" : "אין שיחות")); return; }
  list.sort((x, y) => !!y.pinned - !!x.pinned);
  const out = [];
  for (const s of list) {
    const un = s.unread && !s.muted;
    const w = el("div", "spw");
    const b = el("button", "sp" + (st.cur && st.cur.space === s.space ? " on" : "") + (s.muted ? " muted" : "") + (un ? " un" : ""));

    const t = el("div", "t"), n = el("div", "n");
    n.append(el("span", "", s.title), el("small", "", s.last ? fmtWhen(s.last) : ""));

    out.push(w);
  }

}
$("search").oninput = renderSpaces;

// ---------------------------------------------------------------- התראות
function setBell() { const on = st.notif && "Notification" in window && Notification.permission === "granted"; $("bell").classList.toggle("on", on); $("bell").title = on ? "התראות פועלות (לחיצה מכבה)" : "התראות על הודעות חדשות"; return on; }
$("bell").onclick = async () => {
  if (!("Notification" in window)) return toast("הדפדפן הזה לא תומך בהתראות");
  if (setBell()) { st.notif = false; store.set("chat_notif", "0"); setBell(); return toast("ההתראות כובו"); }

  const s = st.cur; if (!s) return;
  $("ctitle").textContent = s.title;
  $("csub").textContent = (s.dm ? "שיחה פרטית" : "קבוצה") + (s.muted ? " · מושתקת" : "");

  // מעבר בין שיחות או שרשורים: טיוטה לכל מקום, בלי תיקון ובלי קובץ שנשארו ממקום אחר

function setThread(t) { st.thread = t || ""; switchView(); loadMsgs(); }

    const j = th ? await api("thread", null, "?space=" + encodeURIComponent(s.space) + "&thread=" + encodeURIComponent(th))
      : await api("messages", null, "?space=" + encodeURIComponent(s.space));

    const cur = st.cur;
    if (st.loadedKey !== key) {

    if (!th && cur.unread && visible()) { cur.unread = false; if (st.seen) st.seen[cur.space] = ""; renderSpaces(); api("read", { space: cur.space }).catch(() => {}); }

}
async function loadOlder() {

// הקלטה קולית: לחיצה מתחילה, לחיצה נוספת מסיימת ומצרפת את ההקלטה להודעה
let rec = null;
function stopRec(discard) {
  if (!rec) return;
  const r = rec; rec = null; r.discard = !!discard;
  clearInterval(r.timer); $("mic").classList.remove("rec"); $("mict").textContent = "";
  try { r.mr.stop(); } catch (e) {}
  r.stream.getTracks().forEach((t) => t.stop());
}
$("mic").onclick = async () => {
  if (rec) return stopRec(false);
  if (st.edit) return toast("אי אפשר להקליט בזמן תיקון הודעה");
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("הדפדפן הזה לא תומך בהקלטה");
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast("אין גישה למיקרופון"); }
  const mr = new MediaRecorder(stream), chunks = [], r = { mr, stream, discard: false, start: Date.now() };
  mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    if (r.discard || !chunks.length) return;
    const type = (mr.mimeType || "audio/webm").split(";")[0];
    pickFile(new File(chunks, "הקלטה קולית." + (type.includes("ogg") ? "ogg" : type.includes("mp4") ? "m4a" : "webm"), { type }));
  };
  r.timer = setInterval(() => { const sec = Math.floor((Date.now() - r.start) / 1000); $("mict").textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); if (sec >= 300) stopRec(false); }, 500);
  rec = r; $("mic").classList.add("rec"); $("mict").textContent = "0:00"; mr.start();
};
// הוספת טקסט במקום הסמן, ועיטוף הטקסט המסומן (Ctrl+B מודגש, Ctrl+I נטוי)
function insertText(t) { const x = $("text"), a = x.selectionStart, b = x.selectionEnd; x.setRangeText(t, a, b, "end"); x.focus(); grow(); saveDraft(); }
function wrapSel(mark) { const x = $("text"), a = x.selectionStart, b = x.selectionEnd; if (a === b) return; x.setRangeText(mark + x.value.slice(a, b) + mark, a, b, "select"); grow(); saveDraft(); }
$("emobtn").onclick = (e) => { e.stopPropagation(); if (!$("emo").classList.contains("hide")) return closeEmo(); openEmoji($("emobtn"), insertText); };
// אזכור: אחרי @ מוצעים חברי השיחה
let sugg = { list: [], i: 0, from: 0 };
function hideSugg() { $("sugg").classList.add("hide"); sugg.list = []; }
function updateSugg() {
  const x = $("text"), s = st.cur; if (!s || st.edit) return hideSugg();
  const m = /(^|\s)@([^\s@]*)$/.exec(x.value.slice(0, x.selectionStart));
  const mem = st.mem[s.space] || [];
  if (!m || !mem.length) return hideSugg();
  const q = m[2].toLowerCase();
  const list = mem.filter((p) => !p.me && p.name && p.name.toLowerCase().includes(q)).slice(0, 6);
  if (!s.dm && "כולם".includes(q)) list.push({ name: "כולם", uid: "users/all" });
  if (!list.length) return hideSugg();
  sugg = { list, i: 0, from: x.selectionStart - m[2].length - 1 };
  drawSugg();
}
function drawSugg() {
  $("sugg").replaceChildren(...sugg.list.map((p, i) => {
    const b = el("button", i === sugg.i ? "on" : ""); b.type = "button";
    const av = el("div", "av", initial(p.name)); av.style.background = colorOf(p.name);
    b.append(av, el("span", "", p.name)); b.onmousedown = (e) => { e.preventDefault(); pickSugg(i); }; return b;
  }));
  $("sugg").classList.remove("hide");
}
function pickSugg(i) { const p = sugg.list[i], x = $("text"); if (!p) return; x.setRangeText("@" + p.name + " ", sugg.from, x.selectionStart, "end"); hideSugg(); x.focus(); saveDraft(); }
// לפני השליחה: @שם הופך לאזכור אמיתי של גוגל
function withMentions(text, space) {
  const mem = (st.mem[space] || []).filter((p) => p.name && !p.me).concat({ name: "כולם", uid: "users/all" }).sort((a, b) => b.name.length - a.name.length);
  for (const p of mem) text = text.split("@" + p.name).join("<" + p.uid + ">");
  return text;
}
$("quotex").onclick = () => setQuote(null);
$("attach").onclick = () => $("fileinput").click();
// הקריאה של כל קובץ מסתיימת לפני הבא, כדי שהמגבלות ייבדקו נכון
async function pickFiles(list) { for (const f of [...list]) { pickFile(f); await new Promise((r) => setTimeout(r, 60)); } }
$("fileinput").onchange = () => { pickFiles($("fileinput").files); $("fileinput").value = ""; };
$("text").addEventListener("paste", (e) => { const fs = [...(e.clipboardData && e.clipboardData.files || [])]; if (fs.length) { e.preventDefault(); pickFiles(fs); } });
const conv = $("conv");
const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
conv.addEventListener("dragover", (e) => { if (st.cur && hasFiles(e)) { e.preventDefault(); conv.classList.add("drag"); } });
conv.addEventListener("dragleave", (e) => { if (!conv.contains(e.relatedTarget)) conv.classList.remove("drag"); });
conv.addEventListener("drop", (e) => { conv.classList.remove("drag"); if (!st.cur || !hasFiles(e)) return; e.preventDefault(); pickFiles(e.dataTransfer.files); });

$("compose").onsubmit = async (e) => {
  e.preventDefault();
  const s = st.cur, t = $("text").value.trim(); if (!s) return;
  if (st.edit) {
    const m = st.edit; if (!t) return;
    if (t === m.text) return stopEdit();
    try { await api("edit", { space: s.space, id: m.id, text: t }); patchMsg(m.id, (x) => { x.text = t; x.edited = true; }); stopEdit(); paint(); loadMsgs(); }
    catch (err) { toast("התיקון לא נשמר: " + err.message); }
    return;
  }
  if (rec) return toast("קודם לסיים את ההקלטה (לחיצה על המיקרופון)");
  if (!t && !st.files.length) return;
  // ההודעה מופיעה מיד, והשליחה ממשיכה ברקע
  const p = { id: "p" + (++st.seq), key: viewKey(), space: s.space, thread: st.thread, text: t, files: st.files, quote: st.quote, state: "sending", err: "" };
  st.pending.push(p);
  $("text").value = ""; grow(); setFiles([]); setQuote(null); hideSugg();
  delete st.drafts[p.key]; store.set("chat_drafts", JSON.stringify(st.drafts));
  deliver(p);
};
async function deliver(p) {
  p.state = "sending"; p.err = ""; st.toBottom = true; paint();
  try {
    const body = { space: p.space, text: withMentions(p.text, p.space) };
    if (p.thread) body.thread = p.thread;
    if (p.files.length) body.files = p.files.map((f) => ({ name: f.name, type: f.type, data: f.data }));
    if (p.quote) body.quote = { id: p.quote.id, upd: p.quote.upd, text: (p.quote.text || "").slice(0, 80) };
    await api("send", body);
    p.state = "sent";
    if (viewKey() === p.key) { st.toBottom = true; await loadMsgs(); }
    st.pending = st.pending.filter((x) => x !== p); paint();
  } catch (e) { p.state = "failed"; p.err = e.message; paint(); }
}

// ---------------------------------------------------------------- חיפוש בשיחה, סיכום, השתקה
function closeFind() { st.q = ""; $("find").value = ""; $("findbar").classList.add("hide"); $("findbtn").classList.remove("on"); }
$("findbtn").onclick = () => { if (!$("findbar").classList.contains("hide")) { closeFind(); st.toBottom = true; return paint(); } $("findbar").classList.remove("hide"); $("findbtn").classList.add("on"); $("find").focus(); };
$("findx").onclick = () => { closeFind(); st.toBottom = true; paint(); };
$("find").oninput = () => { st.q = $("find").value; st.toBottom = true; paint(); };
$("sum").onclick = async () => {
  const s = st.cur; if (!s) return;
  $("summary").classList.remove("hide"); $("sumtext").textContent = "מסכם...";
  try { const j = await api("summary", { space: s.space }); if (st.cur && st.cur.space === s.space) $("sumtext").textContent = j.summary; }
  catch (e) { $("sumtext").textContent = e.message; }
};
$("sumx").onclick = () => $("summary").classList.add("hide");
$("mute").onclick = async () => {
  const s = st.cur; if (!s) return;
  try { const j = await api("mute", { space: s.space, on: !s.muted }); s.muted = j.muted; setHead(); renderSpaces(); toast(s.muted ? "הקבוצה הושתקה" : "ההשתקה בוטלה"); }
  catch (e) { toast(e.message); }
};

// ---------------------------------------------------------------- שיחה חדשה או קבוצה חדשה
let pqTimer = 0, pqSeq = 0, grp = false, picked = [];
function peopleMsg(t) { $("people").replaceChildren(el("div", "empty", t)); }
function personRow(p, onPick) {
  const b = el("button", "sp"); b.type = "button";
  const av = el("div", "av", initial(p.name)); av.style.background = colorOf(p.name);
  const t = el("div", "t"), e = el("div", "d", p.email); e.dir = "ltr";
  t.append(el("div", "n", p.name), e);
  b.append(av, t); b.onclick = () => onPick(p, b); return b;
}
// חיפוש אנשים משותף: לשיחה חדשה, לקבוצה חדשה ולהוספת חבר
function peopleSearch(input, box, onPick, hint) {
  const msg = (t) => box.replaceChildren(el("div", "empty", t));
  input.oninput = () => {
    clearTimeout(pqTimer);
    const q = input.value.trim(), n = ++pqSeq;
    if (q.length < 2) return msg(hint);
    pqTimer = setTimeout(async () => {
      msg("מחפש...");
      try {
        const j = await api("people", null, "?q=" + encodeURIComponent(q));
        if (n !== pqSeq) return;
        if (!j.people.length) return msg("לא נמצא אף אחד בשם הזה");
        box.replaceChildren(...j.people.map((p) => personRow(p, onPick)));
      } catch (e) { if (n === pqSeq) msg(e.message); }
    }, 350);
  };
}
function drawPicked() {
  $("picked").replaceChildren(...picked.map((p) => {
    const c = el("span", "fchip"), x = el("button"); x.type = "button"; x.setAttribute("aria-label", "הסרת " + p.name); x.append(icon("x"));
    x.onclick = () => { picked = picked.filter((y) => y !== p); drawPicked(); };
    c.append(el("span", "", p.name), x); return c;
  }));
  $("gcreate").disabled = !picked.length;
}
function setMode(g) {
  grp = g; picked = [];
  $("modedm").classList.toggle("on", !g); $("modegrp").classList.toggle("on", g);
  for (const id of ["gname", "picked", "gcreate"]) $(id).classList.toggle("hide", !g);
  $("pq").value = ""; $("gname").value = ""; drawPicked();
  peopleMsg(g ? "חפש אנשים והוסף אותם לקבוצה" : "הקלד שם כדי לחפש");
  (g ? $("gname") : $("pq")).focus();
}
$("modedm").onclick = () => setMode(false);
$("modegrp").onclick = () => setMode(true);
$("newbtn").onclick = () => { $("newdm").classList.remove("hide"); setMode(false); };
const closeNew = () => $("newdm").classList.add("hide");
$("newx").onclick = closeNew;
$("newdm").onclick = (e) => { if (e.target === $("newdm")) closeNew(); };
peopleSearch($("pq"), $("people"), (p, b) => {
  if (!grp) return startDm(p, b);
  if (!picked.some((y) => y.email === p.email)) picked.push(p);
  drawPicked(); $("pq").value = ""; peopleMsg("אפשר להוסיף עוד אנשים"); $("pq").focus();
}, "הקלד שם כדי לחפש");
function enterSpace(j) {
  let s = st.spaces.find((x) => x.space === j.space);
  if (!s) { s = { space: j.space, dm: !!j.dm, title: j.title, last: "", unread: false, muted: false }; st.spaces.unshift(s); }
  closeNew(); openSpace(s);
}
async function startDm(p, btn) {
  btn.disabled = true;
  try { enterSpace(await api("dm", { email: p.email, name: p.name })); }
  catch (e) { btn.disabled = false; toast(e.message); }
}
$("gcreate").onclick = async () => {
  const name = $("gname").value.trim();
  if (!name) { $("gname").focus(); return toast("צריך לתת שם לקבוצה"); }
  $("gcreate").disabled = true;
  try { enterSpace(await api("group", { name, emails: picked.map((p) => p.email) })); }
  catch (e) { toast(e.message); }
  $("gcreate").disabled = false;
};

// ---------------------------------------------------------------- חלון כללי: פרטי שיחה, העברה, מי הגיב
function openSheet(title, nodes) { $("sheett").textContent = title; $("sheetb").replaceChildren(...nodes); $("sheet").classList.remove("hide"); }
const closeSheet = () => $("sheet").classList.add("hide");
$("sheetx").onclick = closeSheet;
$("sheet").onclick = (e) => { if (e.target === $("sheet")) closeSheet(); };
const sure = (btn, label, fn) => { btn.onclick = () => { if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.lastChild.textContent = label; return; } fn(); }; };
async function showReactors(m) {
  openSheet("מי הגיב", [el("div", "empty", "טוען...")]);
  try {
    const j = await api("reactors", null, "?space=" + encodeURIComponent(st.cur.space) + "&id=" + encodeURIComponent(m.id));
    openSheet("מי הגיב", j.reactors.length ? j.reactors.map((r) => { const d = el("div", "mrow"); d.append(el("span", "", r.e), el("span", "t", r.who.join(", "))); return d; }) : [el("div", "empty", "אין תגובות")]);
  } catch (e) { openSheet("מי הגיב", [el("div", "empty", e.message)]); }
}
function forward(m) {
  openSheet("העברה לשיחה אחרת", st.spaces.filter((x) => x.space !== st.cur.space).map((x) => {
    const b = el("button", "sp"); b.type = "button";
    const av = el("div", "av sm", initial(x.title)); av.style.background = colorOf(x.title);
    b.append(av, el("div", "t", x.title));
    b.onclick = async () => { b.disabled = true; try { await api("send", { space: x.space, text: m.text }); closeSheet(); toast("ההודעה הועברה אל " + x.title); loadSpaces(); } catch (e) { b.disabled = false; toast(e.message); } };
    return b;
  }));
}
async function showInfo() {
  const s = st.cur; if (!s) return;
  const draw = (mem) => {
    const nodes = [];
    if (!s.dm) {
      const nm = el("input", "in"); nm.value = s.title; nm.maxLength = 80; nm.setAttribute("aria-label", "שם הקבוצה");
      const save = el("button", "chip", "שמירת השם");
      save.onclick = async () => { const v = nm.value.trim(); if (!v || v === s.title) return; try { s.title = (await api("rename", { space: s.space, name: v })).title; setHead(); renderSpaces(); toast("השם עודכן"); } catch (e) { toast(e.message); } };
      const r = el("div", "mrow"); nm.style.flex = "1"; nm.style.margin = "0"; r.append(nm, save); nodes.push(r);
      nodes.push(el("div", "sect", "חברים" + (mem ? " (" + mem.length + ")" : "")));
      if (!mem) nodes.push(el("div", "empty", "טוען..."));
      for (const p of mem || []) {
        const row = el("div", "mrow"), av = el("div", "av sm", initial(p.name)); av.style.background = colorOf(p.name);
        row.append(av, el("span", "t", p.name + (p.me ? " (אתה)" : "")));
        if (p.manager) row.append(el("small", "", "מנהל"));
        if (!p.me) { const x = el("button", "x"); x.type = "button"; x.append("הסרה"); sure(x, "ללחוץ שוב להסרה", async () => { try { await api("removemember", { space: s.space, mid: p.mid }); toast(p.name + " הוסר מהקבוצה"); draw(await loadMembers(s.space, true)); } catch (e) { toast(e.message); } }); row.append(x); }
        nodes.push(row);
      }
      nodes.push(el("div", "sect", "הוספת חבר"));
      const f = el("label", "field"), inp = el("input"); inp.type = "search"; inp.placeholder = "שם או כתובת מייל"; inp.setAttribute("aria-label", "הוספת חבר לפי שם או כתובת מייל"); f.append(inp);
      const box = el("div");
      peopleSearch(inp, box, async (p, b) => { b.disabled = true; try { await api("addmember", { space: s.space, email: p.email }); toast(p.name + " נוסף לקבוצה"); draw(await loadMembers(s.space, true)); } catch (e) { b.disabled = false; toast(e.message); } }, "");
      nodes.push(f, box);
    }
    const atts = allMsgs().flatMap((m) => (m.atts || []).map((a) => ({ a, m })));
    nodes.push(el("div", "sect", "קבצים בהודעות שנטענו" + (atts.length ? " (" + atts.length + ")" : "")));
    if (!atts.length) nodes.push(el("div", "empty", "אין קבצים"));
    for (const { a, m } of atts.reverse()) {
      const b = el("button", "rowbtn"); b.type = "button"; b.append(icon("file"), el("span", "t", a.name), el("small", "", fmtDay(m.at)));
      b.onclick = () => (a.ref ? download(a) : a.drive ? window.open("https://drive.google.com/file/d/" + encodeURIComponent(a.drive) + "/view", "_blank", "noopener") : toast("אי אפשר להוריד את הקובץ הזה"));
      nodes.push(b);
    }
    if (!s.dm) {
      const out = el("button", "rowbtn danger"); out.type = "button"; out.append(icon("out"), el("span", "", "יציאה מהקבוצה"));
      sure(out, "ללחוץ שוב כדי לצאת מהקבוצה", async () => { try { await api("leave", { space: s.space }); closeSheet(); st.spaces = st.spaces.filter((x) => x.space !== s.space); closeConv(); toast("יצאת מהקבוצה"); } catch (e) { toast(e.message); } });
      nodes.push(el("div", "sect", ""), out);
    }
    if (st.cur === s || (st.cur && st.cur.space === s.space)) openSheet(s.dm ? "פרטי השיחה" : "פרטי הקבוצה", nodes);
  };
  draw(s.dm ? [] : st.mem[s.space] || null);
  if (!s.dm) draw(await loadMembers(s.space, true));
}
$("infobtn").onclick = showInfo;

// ---------------------------------------------------------------- תצוגת תמונה
let viewing = null;
function openViewer(a, url) { viewing = a; $("vimg").src = url; $("vimg").alt = a.name; $("viewer").classList.remove("hide"); }
const closeViewer = () => { $("viewer").classList.add("hide"); $("vimg").removeAttribute("src"); viewing = null; };
$("vx").onclick = closeViewer;
$("vdl").onclick = () => { if (viewing) download(viewing); };
$("viewer").onclick = (e) => { if (e.target === $("viewer") || e.target === $("viewer").firstElementChild) closeViewer(); };

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("viewer").classList.contains("hide")) return closeViewer();
  if (!$("emo").classList.contains("hide")) return closeEmo();
  if (!$("sheet").classList.contains("hide")) return closeSheet();
  if (!$("newdm").classList.contains("hide")) return closeNew();
  if (!$("menu").classList.contains("hide")) return closeMenu();
  if (!$("findbar").classList.contains("hide")) { closeFind(); st.toBottom = true; return paint(); }
  if (st.thread) return setThread("");
});
document.addEventListener("visibilitychange", () => { if (visible() && st.token) { loadSpaces(); if (st.cur) loadMsgs(); } });

function start() {
  show("app"); setBell();
  if (!st.cur) closeConv(true);
  loadSpaces();
  st.timers.forEach(clearInterval);
  // שיחה פתוחה נבדקת כל כמה שניות; רשימת השיחות פחות
  st.timers = [
    setInterval(() => { if (visible() && st.cur) loadMsgs(); }, 7000),
    setInterval(() => { if (visible() || st.notif) loadSpaces(); }, 25000),
  ];
}
if (st.token) start(); else show("login");
</script>
